<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">

<meta name="description" content="STAR QUEST — a turn-based fantasy adventure. Fight monsters, upgrade items and defeat the dragon!">
<meta property="og:type" content="website">

<meta property="og:description" content="Turn-based fantasy adventure — fight monsters, upgrade items and defeat the dragon!">
<meta property="og:url" content="https://sikosoof56.github.io/Starquest/">
<meta property="og:image" content="https://sikosoof56.github.io/Starquest/og-cover.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://sikosoof56.github.io/Starquest/og-cover.jpg">
<link rel="manifest" href="manifest.webmanifest?v=2">
<link rel="icon" href="icon-192-v2.png">
<link rel="apple-touch-icon" href="apple-touch-icon-v2.png">
<meta name="theme-color" content="#0d1d12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="STAR QUEST">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Nunito:wght@400;700;800;900&display=swap">
<style>

:root{--bg:#0d1d12;--card:#152b1b;--card2:#1c3824;--line:#2f5a37;--leaf:#8fd14f;--leaf2:#4caf50;--gold:#f2c94c;
  --ink:#eef6e6;--mute:#a9c4a0;--red:#e5533d;--blue:#3f8fd8}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{touch-action:manipulation;-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;font-family:Nunito,system-ui,sans-serif;color:var(--ink);overscroll-behavior:none;
  background:radial-gradient(ellipse at 50% -10%,#2c5a33 0%,#13281a 45%,var(--bg) 80%) fixed;
  -webkit-user-select:none;user-select:none;min-height:100vh}
#app{max-width:520px;margin:0 auto;padding:12px;padding-top:max(12px,env(safe-area-inset-top));padding-bottom:max(16px,env(safe-area-inset-bottom))}
h1{font-family:Cinzel,Georgia,serif;font-weight:900;font-size:24px;text-align:center;letter-spacing:2px;margin:4px 0 12px;
  color:var(--gold);text-shadow:0 2px 0 #5a3e0a,0 0 14px #f2c94c55;display:flex;align-items:center;justify-content:center;gap:8px}
h1 .crest .i{width:24px;height:24px;vertical-align:-3px}
h2{font-family:Cinzel,Georgia,serif;font-size:17px;margin:0 0 10px;color:#f4e7c0;display:flex;align-items:center;gap:6px}
.sub{font-size:12px;letter-spacing:1px;text-transform:uppercase;color:var(--leaf);margin:10px 0 2px;font-weight:800}
.card{background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:10px;
  box-shadow:0 4px 14px #0006,inset 0 1px 0 #ffffff10}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between}
.i{width:1.15em;height:1.15em;vertical-align:-.22em;flex-shrink:0}
.ii{width:30px;height:30px;flex-shrink:0;vertical-align:middle}
.bar{height:10px;background:#0b170e;border-radius:6px;overflow:hidden;margin:3px 0 6px;box-shadow:inset 0 1px 2px #000a}
.bar>i{display:block;height:100%;transition:width .35s;border-radius:6px}
.hp>i{background:linear-gradient(90deg,#d83a2c,#ff7b6b)}
.mp>i{background:linear-gradient(90deg,#2f7fd0,#7fd3ff)}
.ex>i{background:linear-gradient(90deg,#d9a520,#ffe27a)}
.qb>i{background:linear-gradient(90deg,#4caf50,#b8ff5a)}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
button{font:inherit;font-weight:700;font-size:15px;padding:12px;border-radius:12px;border:1px solid #3f7347;color:var(--ink);cursor:pointer;
  background:linear-gradient(180deg,#24472d,#1a3622);box-shadow:0 3px 0 #0b1a0f,inset 0 1px 0 #ffffff14;display:inline-flex;align-items:center;justify-content:center;gap:6px}
button:active{transform:translateY(2px);box-shadow:0 1px 0 #0b1a0f}
button:disabled{opacity:.42;cursor:default}
button.pri{background:linear-gradient(180deg,#8fd14f,#4f9a2c);border-color:#b8ff5a;color:#10230f;box-shadow:0 3px 0 #2c5a18}
button.warn{background:linear-gradient(180deg,#a8392b,#7a2418);border-color:#e5533d}
button.ok{background:linear-gradient(180deg,#f2c94c,#c99a1e);border-color:#ffe27a;color:#3a2a05;box-shadow:0 3px 0 #7a5a0a}
.full{width:100%;margin-top:8px}
.small{font-size:13px;color:var(--mute)}
.msg{color:var(--gold);font-size:14px;font-weight:700;margin:8px 0 0}
.gold{font-weight:800;color:var(--gold);white-space:nowrap;display:inline-flex;align-items:center;gap:4px}
.tag{display:inline-block;background:#8fd14f22;color:var(--leaf);border:1px solid #8fd14f66;border-radius:8px;padding:0 7px;font-size:12px;margin-left:6px;font-weight:800}
/* Hero card */
.hero{position:relative;overflow:hidden;background:linear-gradient(160deg,#2a5232,#152b1b 65%);border-color:#4b8a4f}
.hero::before{content:'';position:absolute;top:0;left:-60%;width:40%;height:100%;pointer-events:none;
  background:linear-gradient(100deg,transparent,#ffffff12,transparent);animation:shine 6s ease-in-out infinite}
.nm{font-family:Cinzel,Georgia,serif;font-size:17px}
.avatar{width:70px;height:70px;border-radius:18px;flex-shrink:0;overflow:hidden;
  background:radial-gradient(circle at 50% 35%,#cfeaa8,#5fa043 70%);border:2px solid var(--gold);box-shadow:0 0 0 3px #0b170e,0 4px 10px #0008}
.avatar .art{width:100%;height:100%;transform:translateY(6px) scale(1.15)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:8px 0}
.stat{background:#0b170e99;border:1px solid #2f5a37;border-radius:10px;padding:6px 4px;text-align:center}
.stat b{display:block;font-size:17px}
.stat span{font-size:11px;color:var(--mute);letter-spacing:.5px}
.mini{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mini button{padding:9px;font-size:13px}
.topbar{display:flex;gap:10px;align-items:center}
.mini-av{width:48px;height:48px;border-radius:12px;overflow:hidden;flex-shrink:0;background:radial-gradient(circle at 50% 35%,#cfeaa8,#5fa043 70%);border:2px solid var(--gold)}
.mini-av .art{width:100%;height:100%;transform:translateY(4px) scale(1.15)}
.topbar .bar{height:7px;margin:3px 0}
/* Menu tiles */
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{position:relative;aspect-ratio:1/1;flex-direction:column;gap:4px;padding:6px;font-size:13px;line-height:1.25;text-align:center;border-radius:16px;
  background:linear-gradient(180deg,#24472d,#16301d);border:1px solid #3f7347}
.tile .ic{display:block;width:46px;height:46px;transition:transform .2s;filter:drop-shadow(0 3px 2px #0008)}
.tile .ic svg{width:100%;height:100%}
.tile:active .ic{transform:scale(1.15) rotate(-6deg)}
.tile-av{display:block;width:46px;height:46px;border-radius:50%;overflow:hidden;border:2px solid var(--gold);background:#5fa043}
.tile-av .art{width:100%;height:100%;transform:translateY(4px) scale(1.2)}
.badge{position:absolute;top:6px;right:6px;background:var(--red);color:#fff;border-radius:10px;font-size:11px;padding:1px 6px;font-weight:800}
.badge.soon{background:#0b170e;color:var(--mute);border:1px solid #2f5a37}
/* Lists */
.item{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid #2f5a3766}
.item:last-child{border:0}
.item button{padding:8px 12px;font-size:14px;white-space:nowrap}
.it{display:flex;align-items:center;gap:10px}
.slots{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:6px}
.slot{display:flex;gap:8px;align-items:center;background:#0b170e88;border:1px dashed #3f7347;border-radius:12px;padding:8px;font-size:13px;font-weight:700}
.slot>.i{width:30px;height:30px;color:var(--mute)}
.story{font-size:14px;line-height:1.7;color:#e0eed6;background:#0b170e99;border-left:3px solid var(--leaf);border-radius:10px;padding:10px 12px;margin:10px 0}
.map{width:100%;height:auto;display:block;border-radius:14px;box-shadow:inset 0 0 0 2px #0b170e,0 4px 10px #0007}
.map .ping{animation:ping 1.4s ease-out infinite;transform-box:fill-box;transform-origin:center}
.chars{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ch{border:1px solid #3f7347;border-radius:14px;padding:8px 4px;text-align:center;font-size:12px;background:#0b170e88}
.ch .e{width:64px;height:64px;margin:0 auto;border-radius:50%;overflow:hidden;background:radial-gradient(circle at 50% 35%,#cfeaa8,#5fa043 70%)}
.ch .e .art{width:100%;height:100%;transform:translateY(5px) scale(1.15)}
.ch .e.lk{display:flex;align-items:center;justify-content:center;background:#0b170e}
.ch .e.lk .i{width:28px;height:28px;color:var(--mute)}
.ch.sel{border-color:var(--gold);box-shadow:0 0 10px #f2c94c55}
.ch.lock{opacity:.5}
.pvp-art{display:flex;align-items:center;justify-content:center;gap:4px}
.pvp-art .art{width:110px;height:110px}
.pvp-art .art:last-child{transform:scaleX(-1)}
.vs{font-family:Cinzel,serif;font-weight:900;font-size:28px;color:var(--gold);text-shadow:0 2px 0 #5a3e0a}
textarea{width:100%;height:70px;background:#0b170e;color:var(--leaf);border:1px solid #3f7347;border-radius:10px;font-size:16px;padding:8px;-webkit-user-select:text;user-select:text}
.lbl{display:block;font-size:13px;color:var(--mute);margin:10px 0 4px;font-weight:700}
input:not([type=checkbox]){width:100%;font:inherit;font-size:16px;padding:12px;border-radius:12px;border:1px solid #3f7347;background:#0b170e;color:var(--ink);
  -webkit-user-select:text;user-select:text;outline:none}
input:focus{border-color:var(--leaf);box-shadow:0 0 0 3px #8fd14f33}
.check{display:flex;gap:8px;align-items:center;font-size:14px;margin:12px 0 2px}
.check input{width:20px;height:20px;accent-color:#8fd14f}
/* ===== Battle scene ===== */
#log{height:104px;overflow-y:auto;font-size:14px;line-height:1.6}
#log div:last-child{color:#fff;font-weight:700}
.scene{position:relative;height:300px;border-radius:18px;overflow:hidden;margin-bottom:10px;border:2px solid #4b8a4f;box-shadow:0 6px 18px #000a}
.scene .bg{position:absolute;inset:0;width:100%;height:100%}
.ent{position:absolute;z-index:2}
.ent .art{width:100%;height:100%;overflow:visible;display:block}
.en{right:6%;top:64px;width:124px;height:124px;animation:inR .7s cubic-bezier(.2,.9,.3,1.2) backwards}
.en.flyer{top:40px}
.en.boss{right:3%;top:38px;width:160px;height:160px}
.pl{left:6%;bottom:30px;width:112px;height:112px;animation:inL .7s cubic-bezier(.2,.9,.3,1.2) .15s backwards}
.shadow{position:absolute;z-index:1;border-radius:50%;background:radial-gradient(#0008,transparent 70%)}
.se{right:calc(6% + 12px);top:176px;width:100px;height:22px}
.se.fly{width:70px;right:calc(6% + 27px);opacity:.6}
.se.big{right:calc(3% + 16px);top:186px;width:128px;height:26px}
.sp{left:calc(6% + 12px);bottom:24px;width:90px;height:18px}
.ent.guard::after{content:'';position:absolute;inset:-6px;border-radius:50%;border:3px solid #b8ff5a;
  box-shadow:0 0 18px #8fd14f,inset 0 0 18px #8fd14f66;animation:pulse 1s ease-in-out infinite;pointer-events:none}
.plate{position:absolute;z-index:3;width:48%;background:#0d1d12e0;border:1px solid #4b8a4f;border-radius:12px;padding:6px 8px;font-size:12px;box-shadow:0 3px 8px #0008}
.plate b{font-size:12px}
.plate .bar{height:7px;margin:3px 0}
.plate.e{left:8px;top:8px}.plate.p{right:8px;bottom:8px}
.ff{position:absolute;z-index:1;width:5px;height:5px;border-radius:50%;background:#fffbb0;box-shadow:0 0 8px 3px #fff59d99;animation:ff 6s ease-in-out infinite;pointer-events:none}
.lf{position:absolute;z-index:1;top:-12px;width:10px;height:10px;background:#9ccc65;border-radius:0 100% 0 100%;animation:fall 9s linear infinite;pointer-events:none;opacity:.85}
.ft{position:absolute;z-index:6;pointer-events:none;white-space:nowrap;font-family:Nunito,sans-serif;font-weight:900;font-size:26px;color:#fff;
  -webkit-text-stroke:1px #2a0f0a;text-shadow:0 3px 0 #2a0f0a,0 0 10px #ff5a4a}
.ft.crit{font-size:32px;color:#ffd54a;text-shadow:0 3px 0 #4a2a00,0 0 12px #ff9800}
.ft.heal{color:#c6ff7a;-webkit-text-stroke:1px #0f2a0f;text-shadow:0 3px 0 #0f2a0f,0 0 10px #4caf50}
.ft.mp{color:#9be3ff;-webkit-text-stroke:1px #0a1f33;text-shadow:0 3px 0 #0a1f33,0 0 10px #3f8fd8}
.ft.big{font-family:Cinzel,serif;font-size:30px;color:#ffd54a;text-shadow:0 3px 0 #4a2a00,0 0 16px #ffd54a}
.pt{position:absolute;z-index:5;pointer-events:none;transform:translate(-50%,-50%)}
.pt.spark{width:9px;height:9px;border-radius:50%;background:var(--c,#fff);box-shadow:0 0 10px 3px var(--c,#fff)}
.pt.leaf{width:12px;height:12px;background:#8fd14f;border-radius:0 100% 0 100%;box-shadow:0 0 6px #b8ff5a}
.pt.coin{width:14px;height:14px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff2b0,#f2c94c 50%,#b8861b);border:1px solid #8a6312}
.pt.fire{width:14px;height:14px;border-radius:50%;background:radial-gradient(#fff3b0,#ff9800 50%,#e5533d);box-shadow:0 0 12px 4px #ff9800aa}
.pt.plus{font-weight:900;font-size:22px;color:var(--c,#b8ff5a);text-shadow:0 0 8px var(--c,#b8ff5a),0 2px 0 #0008}
.pt.star{width:14px;height:14px;background:#ffd54a;clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);filter:drop-shadow(0 0 6px #ffd54a)}
.pt.big .ii{width:38px;height:38px}
.slash{position:absolute;z-index:5;pointer-events:none;filter:drop-shadow(0 0 8px #fff)}
/* ===== Character idle / attack animation ===== */
.art .bod,.art .arm,.art .wingL,.art .wingR,.art .tail,.art .crown{transform-box:view-box}
.art .bod{transform-origin:60px 110px;animation:breathe 2.6s ease-in-out infinite}
.art .eyes{transform-box:fill-box;transform-origin:center;animation:blink 4.2s infinite}
.art.hero-art .arm{transform-origin:76px 66px;animation:sway-arm 2.6s ease-in-out infinite}
.hero-art .tail{transform-origin:40px 38px;animation:flutter 1.2s ease-in-out infinite}
.art .squish{animation:squish 1.3s ease-in-out infinite}
.art .hop{animation:hop 1.6s ease-in-out infinite}
.art .fly{transform-origin:60px 62px;animation:hover 1.8s ease-in-out infinite}
.art .wingL{transform-origin:48px 64px;animation:flapL .35s ease-in-out infinite alternate}
.art .wingR{transform-origin:72px 64px;animation:flapR .35s ease-in-out infinite alternate}
.big .wingL{animation-duration:.9s}.big .wingR{animation-duration:.9s}
.art .sway{animation:treesway 3.2s ease-in-out infinite}
.art .crown{transform-origin:60px 40px;animation:treesway 3.2s ease-in-out infinite reverse}
.art .arm{transform-origin:44px 68px}
.big .tail{transform-origin:80px 92px;animation:wag 1.6s ease-in-out infinite}
.atk .art.hero-art .arm{animation:hslash .44s ease-in-out}
.atk .art:not(.hero-art) .arm{animation:club .5s ease-in-out}
.atk .art .squish{animation:jump .44s ease-in-out}
.atk .art .eyes{animation:none;transform:scaleY(.6)}
.hurt .art .eyes{animation:none;transform:scaleY(.15)}
@keyframes breathe{50%{transform:scale(1.025,.975)}}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes sway-arm{50%{transform:rotate(-4deg)}}
@keyframes flutter{50%{transform:rotate(12deg)}}
@keyframes hslash{0%{transform:rotate(0)}35%{transform:rotate(-55deg)}70%{transform:rotate(70deg)}100%{transform:rotate(0)}}
@keyframes club{0%{transform:rotate(0)}40%{transform:rotate(35deg)}75%{transform:rotate(-60deg)}100%{transform:rotate(0)}}
@keyframes squish{0%,100%{transform:scale(1,1)}50%{transform:scale(1.08,.9)}}
@keyframes jump{0%{transform:scale(1)}30%{transform:scale(1.15,.8)}60%{transform:scale(.9,1.15) translateY(-14px)}100%{transform:scale(1)}}
@keyframes hop{0%,100%{transform:translateY(0)}40%{transform:translateY(-6px) rotate(-3deg)}60%{transform:translateY(-6px) rotate(3deg)}}
@keyframes hover{50%{transform:translateY(-9px)}}
@keyframes flapL{from{transform:rotate(18deg) scaleY(.85)}to{transform:rotate(-14deg)}}
@keyframes flapR{from{transform:rotate(-18deg) scaleY(.85)}to{transform:rotate(14deg)}}
@keyframes treesway{50%{transform:rotate(1.5deg)}}
@keyframes wag{50%{transform:rotate(-10deg)}}
@keyframes pulse{50%{transform:scale(1.06);opacity:.7}}
@keyframes ping{0%{transform:scale(.8);opacity:.6}100%{transform:scale(1.6);opacity:0}}
@keyframes inR{from{transform:translateX(170px);opacity:0}}
@keyframes inL{from{transform:translateX(-170px);opacity:0}}
@keyframes ff{0%,100%{transform:translate(0,0);opacity:.2}50%{transform:translate(14px,-18px);opacity:1}}
@keyframes fall{0%{transform:translate(0,0) rotate(0)}100%{transform:translate(-60px,330px) rotate(540deg)}}
/* Page animation */
.page{animation:fadeUp .35s ease-out}
.page .tile{animation:pop .45s cubic-bezier(.2,.9,.3,1.3) backwards}
.page .tile:nth-child(2){animation-delay:.05s}.page .tile:nth-child(3){animation-delay:.1s}
.page .tile:nth-child(4){animation-delay:.15s}.page .tile:nth-child(5){animation-delay:.2s}.page .tile:nth-child(6){animation-delay:.25s}
@keyframes shine{0%,60%{left:-60%}100%{left:130%}}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}}
@keyframes pop{from{opacity:0;transform:scale(.6)}}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
small.mpc{font-size:11px;background:#2f7fd0;color:#fff;border-radius:6px;padding:1px 5px;font-weight:800}
small.mpc::after{content:' MP'}
#ctrl button{font-size:14px;white-space:nowrap;padding:12px 6px}
.valc-art .crest{transform-box:fill-box;transform-origin:50% 100%;animation:flutter 1.8s ease-in-out infinite}
/* ===== Character card (home) ===== */
.cc{display:grid;grid-template-columns:42% 1fr;gap:12px;position:relative;overflow:hidden;
  background:linear-gradient(160deg,#2a5232,#152b1b 65%);border-color:#4b8a4f}
.cc::before{content:'';position:absolute;top:0;left:-60%;width:40%;height:100%;pointer-events:none;
  background:linear-gradient(100deg,transparent,#ffffff10,transparent);animation:shine 6s ease-in-out infinite}
.cc-name{font-family:Cinzel,Georgia,serif;font-weight:900;font-size:18px;color:#f4e7c0;text-align:center;margin-bottom:6px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.portrait{position:relative;display:block;width:100%;aspect-ratio:3/4;padding:0;border-radius:16px;overflow:hidden;
  background:radial-gradient(ellipse at 50% 30%,#d6f0b0,#6fb04f 55%,#2f6b34);border:2px solid var(--gold);
  box-shadow:0 0 0 3px #0b170e,0 6px 14px #0009}
.portrait::after{content:'';position:absolute;left:15%;right:15%;bottom:7%;height:8%;border-radius:50%;background:radial-gradient(#0007,transparent 70%)}
.portrait .art{position:absolute;inset:4% -6% 0;width:112%;height:96%;z-index:1}
.portrait .swap{position:absolute;z-index:2;left:50%;bottom:6px;transform:translateX(-50%);font-size:11px;font-weight:800;
  background:#0d1d12cc;border:1px solid #4b8a4f;color:var(--mute);border-radius:8px;padding:1px 8px}
.cc-stats{margin-top:8px;display:grid;gap:3px}
.cc-stats div{display:flex;justify-content:space-between;align-items:center;background:#0b170e99;border:1px solid #2f5a37;border-radius:8px;padding:3px 8px}
.cc-stats span{font-size:11px;letter-spacing:.8px;color:var(--mute);font-weight:800}
.cc-stats b{font-size:15px}
.cc-r{display:flex;flex-direction:column;min-width:0}
.tag.big{font-size:14px;padding:2px 10px;margin:0}
.xp{margin:6px 0 2px}.xp .bar{height:6px;margin:0}.xp span{font-size:10px;color:var(--mute)}
.sec{font-size:11px;letter-spacing:1.2px;text-transform:uppercase;color:var(--leaf);font-weight:900;margin:8px 0 4px}
.s4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.sl{position:relative;aspect-ratio:1/1;padding:0;border-radius:12px;flex-direction:column;gap:0;
  background:radial-gradient(circle at 50% 35%,#2f5a37,#122617);border:1px solid #4b8a4f;box-shadow:0 2px 0 #0b1a0f,inset 0 1px 0 #ffffff14}
.sl .ii{width:62%;height:62%}

@keyframes gflash{0%{background:#fffde7}100%{}}
@keyframes gpop{0%{transform:scale(.4)}60%{transform:scale(1.15)}100%{transform:scale(1)}}
.gskills{display:grid;gap:6px;margin:8px 0}
.gsk{display:flex;gap:8px;align-items:center;background:#0f2214;border:1px solid var(--line);border-radius:12px;padding:6px 8px}
.gsk .si{width:38px;height:38px;flex:none}
.gres{display:flex;justify-content:center;gap:6px;margin:8px 0;flex-wrap:wrap}
.gres.ten{display:grid;grid-template-columns:repeat(5,1fr)}
.gr{display:flex;flex-direction:column;align-items:center;gap:2px;background:#1c1238;border:1px solid #5e35b1;border-radius:10px;padding:6px 2px;
  font-size:10px;text-align:center;color:#e1bee7;animation:pop .35s both}
.gr .ii,.gr .i{width:30px;height:30px}
.gr.win{background:linear-gradient(180deg,#5c4a00,#3a1f73);border-color:#fff59d;box-shadow:0 0 14px #ffd600;color:#fff59d;font-weight:900}
.gr.win .art{width:46px;height:46px}
.gacha .btns button small{font-size:11px;opacity:.9}
button.gold10{background:linear-gradient(180deg,#f2c94c,#a8741a);color:#2a1a00;border-color:#ffe08a}

/* ===== Formation + skill showcase ===== */
.form .fslot{display:flex;gap:10px;align-items:center;background:radial-gradient(ellipse at 30% 90%,#2f5a37,#122617 70%);border:2px solid var(--gold);border-radius:16px;padding:8px;box-shadow:0 0 14px #f2c94c33}
.fart{width:96px;height:96px;flex:none;filter:drop-shadow(0 4px 6px #0008)}
.fart .art{width:100%;height:100%}
.finfo{flex:1;min-width:0}
.fsk{display:flex;gap:6px;margin:6px 0 2px}
button.skb{padding:0;width:44px;height:44px;border-radius:50%;flex:none;background:none;border:none;box-shadow:none}
button.skb .si{width:44px;height:44px}
button.skb:active{transform:scale(.9)}
.fbench{display:flex;gap:8px;flex-wrap:wrap}
button.fb{flex-direction:column;width:96px;padding:6px 4px;gap:2px;font-size:12px}
.fbart{width:56px;height:56px;display:block}.fbart .art{width:100%;height:100%}
button.fb small{color:var(--leaf);font-weight:900}
.gsk{cursor:pointer}.gsk:active{transform:scale(.98)}
#scm{position:fixed;inset:0;z-index:50;background:#000b;display:none;align-items:center;justify-content:center;padding:14px}
#scm.on{display:flex;animation:fadeUp .25s}
.scbox{width:100%;max-width:440px;background:var(--card);border:2px solid var(--gold);border-radius:18px;padding:12px;box-shadow:0 10px 40px #000}
.scn{display:flex;align-items:center;gap:6px;font-size:17px}.scn .si{width:34px;height:34px}
button.scx{width:36px;height:36px;padding:0;border-radius:50%}
.scene.sc{height:250px;margin:8px 0}
.scene.sc .en{top:70px}
.mage-art .zapz{animation:zapz 1.3s steps(1) infinite}
.mage-art .cape{transform-box:view-box;transform-origin:60px 58px;animation:capew 3s ease-in-out infinite}
@keyframes zapz{0%{opacity:1}12%{opacity:0}30%{opacity:.8}38%{opacity:0}70%{opacity:1}78%{opacity:0}}
@keyframes capew{50%{transform:skewX(-2deg) scaleX(1.02)}}
/* ultimates: rapid hits */
.ft.hitn{font-size:16px;z-index:6}.ft.hitn.crit{font-size:18px}
.pt.shard{width:3px;height:12px;border-radius:2px;background:var(--c,#fff);box-shadow:0 0 6px 1px var(--c,#fff)}
.wave.healw{border-color:#b8ff5a;box-shadow:0 0 16px #8fd14f,inset 0 0 10px #8fd14f}
/* ===== 2v2 ===== */
.teams{display:grid;grid-template-columns:1fr auto 1fr;gap:6px;align-items:center;margin:8px 0}
.team{display:grid;gap:6px}.team h3{margin:0;text-align:center;font-family:Cinzel,serif;font-size:15px}
.team.ta h3{color:#8fd14f}.team.tb h3{color:#ff8a80}
.vs.small2{font-size:20px}
.seat{position:relative;display:flex;flex-direction:column;align-items:center;gap:1px;background:#0f2214;border:2px solid var(--line);border-radius:12px;padding:6px 4px;min-height:104px;font-size:13px;text-align:center}
.seat small{color:var(--mute);font-size:10px}
.seat.me{border-color:var(--gold);box-shadow:0 0 10px #f2c94c55}
.sart{width:52px;height:52px;display:block}.sart .art{width:100%;height:100%}
button.seat.empty{border-style:dashed;font-size:26px;color:var(--mute);background:#0b170e;justify-content:center}
.hosttag{position:absolute;top:4px;right:4px;font-size:9px;font-weight:900;background:var(--gold);color:#2a1a00;border-radius:5px;padding:0 4px}
.scene.s2{height:330px}
.ent.e2{width:88px;height:88px;animation:none;cursor:pointer}
.ent.e2.l1{left:3%;bottom:20px}.ent.e2.l2{left:27%;bottom:128px}
.ent.e2.r1{right:3%;bottom:128px}.ent.e2.r2{right:27%;bottom:20px}
.ent.e2.r2{z-index:3}.ent.e2.l1{z-index:3}
.mp2{position:absolute;left:50%;top:-30px;transform:translateX(-50%);width:96px;background:#0d1d12d8;border:1px solid #4b8a4f;border-radius:8px;padding:2px 5px;font-size:10px;text-align:center;z-index:4}
.mp2 b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mp2 b::after{content:' · ' attr(data-hp);color:var(--mute);font-weight:700}
.mp2 .bar{height:5px;margin-top:1px}
.ent.e2.turn .mp2{border-color:var(--gold);box-shadow:0 0 10px #f2c94c}
.ent.e2.turn::after{content:'▼';position:absolute;left:50%;top:-46px;transform:translateX(-50%);color:var(--gold);font-size:13px;animation:hop 1s infinite}
.ent.e2.tgt .tintw{filter:drop-shadow(0 0 6px #ff5252) drop-shadow(0 0 2px #ff5252)}
.ent.e2.tgt::before{content:'';position:absolute;left:10%;right:10%;bottom:-6px;height:14px;border-radius:50%;border:3px solid #ff5252;box-shadow:0 0 10px #ff5252}
.ent.e2.dead{opacity:.35;filter:grayscale(1)}
.ent.e2.stunned .tintw{filter:brightness(1.4) saturate(.4)}
.ch.lock.soon .e{filter:drop-shadow(0 0 8px #00bfa588)}
.ch.lock.soon{border-color:#00bfa5;background:radial-gradient(ellipse at 50% 30%,#103a35,#0b170e 70%)}
.ch.lock.soon{opacity:1}
</style>

}

// ---- PVP: online rooms with a room code (Firebase Firestore) ----
// Room document rooms/{CODE}:
//  { code, status:'waiting'|'playing'|'done', created, p1:{uid,name,st}, p2:{...}|null,
//    hp:{p1,p2}, cd:{p1:{},p2:{}}, guard:{p1:0,p2:0}, turn:'p1'|'p2', deadline, seq, last:{...}, winner, rewarded:{} }
const PVP_TURN_MS = 30000;
const PV = { code:null, me:null, room:null, unsub:null, seqSeen:0, joinCode:'', err:'', anim:false, timer:null, log:[] };
const LB = { list:null, err:'' };
const lbRef = () => FB.F.doc(FB.db, 'rooms', '_leaderboard_s' + SEASON);
const pvpStats = () => ({ char:S.char, hp:MHP(), atk:atk(), def:def(), spd:spd(), crit:crit() });
const opp = me => me === 'p1' ? 'p2' : 'p1';
function pvpCodeGen(){ const A = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; let c = ''; for(let i=0;i<4;i++) c += A[Math.floor(Math.random()*A.length)]; return c; }
const roomRef = c => FB.F.doc(FB.db, 'rooms', c);

function pvp(){
  if(PV.room && PV.room.status !== 'waiting' && view === 'pvp'){ view = 'pvpb'; return pvpBattle(); }
  let h = `<div class="card"><h2>PVP Arena</h2>
    <div class="pvp-art">${artOf(ch().art)}<span class="vs">VS</span>${artOf(S.char === 'valcarile' ? 'hero' : 'valc')}</div>`;
  if(!FB.ok || !FB.user){
    return h + `<div class="story">Log in to your online account to battle friends.</div>
      <button class="pri full" onclick="go('account')">${IC.user} Login / Sign up</button>${back()}</div>`;
  }
  if(PV.room && PV.room.status === 'waiting'){
    return h + `<div class="story" style="text-align:center">Room code<div class="roomcode">${PV.code}</div>Send this code to your friend. Waiting for them to join…</div>
      <button class="full" onclick="copyRoom()">${IC.copy} Copy code</button>
      <button class="warn full" onclick="pvpLeave()">Cancel room</button></div>`;
  }
  return h + `<div class="story">Make a 1v1 room (2 players) or a 2v2 room (4 players, pick your team), then send the code. Have a code? Type it to join. You fight with your own character, items and skills.
      <b>Potions are not allowed.</b> Faster SPEED moves first. Each turn has 30 seconds. Wins and losses go on the leaderboard.</div>
    <div class="btns"><button class="pri" onclick="pvpCreate()" ${PV.busy?'disabled':''}>${IC.sword} Create 1v1 room</button>
      <button class="pri gold10" onclick="pvp2Create()" ${PV.busy||P2.busy?'disabled':''}>👥 Create 2v2 room</button></div>
    <form onsubmit="event.preventDefault();pvpJoin()" class="joinrow">
      <input id="rc" maxlength="4" autocapitalize="characters" autocomplete="off" spellcheck="false" placeholder="CODE" value="${esc(PV.joinCode)}">
      <button type="submit" ${PV.busy?'disabled':''}>Join</button>
    </form>
    ${PV.err ? `<p class="msg">${PV.err}</p>` : ''}
    <button class="full" onclick="go('lb')">🏆 Leaderboard</button>${back()}</div>`;
}
function copyRoom(){ try{ navigator.clipboard.writeText(PV.code); msg = 'Code copied!'; }catch(e){} render(); }

async function pvpCreate(){
  if(!FB.ok || !FB.user || PV.busy) return;
  PV.busy = true; PV.err = ''; render();
  try{
    let code, tries = 0;
    do{ code = pvpCodeGen(); tries++; } while(tries < 5 && (await FB.F.getDoc(roomRef(code))).exists() && (await FB.F.getDoc(roomRef(code))).data().status !== 'done');
    await FB.F.setDoc(roomRef(code), { code, status:'waiting', created:Date.now(), p1:{ uid:FB.user.uid, name:CUR, st:pvpStats() }, p2:null, seq:0 });
    pvpListen(code, 'p1');
  }catch(e){ PV.err = 'Could not create a room — check your internet.'; }
  PV.busy = false; render();
}
async function pvpJoin(){
  if(!FB.ok || !FB.user || PV.busy) return;
  const code = ($('rc').value || '').trim().toUpperCase(); PV.joinCode = code;
  if(code.length !== 4){ PV.err = 'Room codes have 4 characters.'; render(); return; }
  PV.busy = true; PV.err = ''; render();
  try{
    const pre = await FB.F.getDoc(roomRef(code));
    if(pre.exists() && pre.data().mode === '2v2'){ PV.busy = false; return pvp2Join(code); }
    await FB.F.runTransaction(FB.db, async tx => {
      const snap = await tx.get(roomRef(code));
      if(!snap.exists()) throw new Error('No room with that code.');
      const r = snap.data();
      if(r.p1.uid === FB.user.uid) throw new Error("That's your own room — send the code to a friend.");
      if(r.status !== 'waiting' || r.p2) throw new Error('That room is already full or finished.');
      const me = pvpStats(), first = me.spd > r.p1.st.spd ? 'p2' : 'p1';
      tx.update(roomRef(code), { p2:{ uid:FB.user.uid, name:CUR, st:me }, status:'playing',
        hp:{ p1:r.p1.st.hp, p2:me.hp }, cd:{ p1:{}, p2:{} }, guard:{ p1:0, p2:0 }, turn:first, deadline:Date.now() + PVP_TURN_MS, seq:1,
        last:{ seq:1, text:`${first === 'p1' ? r.p1.name : CUR} is faster and moves first!` } });
    });
    pvpListen(code, 'p2');
  }catch(e){ PV.err = e.message && !e.code ? e.message : 'Could not join — check the code and your internet.'; }
  PV.busy = false; render();
}
function pvpListen(code, me){
  pvpStop();
  PV.code = code; PV.me = me; PV.seqSeen = 0; PV.log = []; PV.playing = false; PV.again = false; PV.lastSync = Date.now();
  PV.unsub = FB.F.onSnapshot(roomRef(code), snap => {
    if(PV.code !== code || !snap.exists()) return;
    const prev = PV.room; PV.room = snap.data();
    if(PV.room.status !== 'waiting' && (view === 'pvp' || view === 'pvpb')){
      if(view !== 'pvpb' || !prev || prev.status === 'waiting'){ view = 'pvpb'; pageAnim = true; render(); }
      pvpOnUpdate();
    } else if(view === 'pvp') render();
  });
  clearInterval(PV.timer); PV.timer = setInterval(pvpTick, 1000);
}
function pvpStop(){ if(PV.unsub) PV.unsub(); PV.unsub = null; clearInterval(PV.timer); PV.timer = null; }
async function pvpLeave(silent){
  const r = PV.room, me = PV.me;
  if(r && FB.ok){
    try{
      if(r.status === 'waiting') await FB.F.updateDoc(roomRef(PV.code), { status:'done', winner:null });
      else if(r.status === 'playing') await FB.F.updateDoc(roomRef(PV.code), { status:'done', winner:opp(me), seq:r.seq+1,
        last:{ seq:r.seq+1, text:`${r[me].name} left the battle.` } });
      if(r.status === 'playing') await pvpRecord(PV.code);
    }catch(e){}
  }
  pvpStop(); PV.room = null; PV.code = null; PV.me = null;
  document.body.classList.remove('locked'); if(!silent){ view = 'pvp'; render(); }
}

// ---- PVP battle screen ----
function pvpBattle(){
  const r = PV.room, me = PV.me, o = opp(me), O = r[o], M = r[me];
  return `<div class="scene" id="scene">${forestBG()}${ambient()}
      <div class="plate e"><div class="row"><b>${esc(O.name)}</b><span>SPD ${O.st.spd}</span></div>
        <div class="bar hp"><i id="enhp"></i></div><div class="small" id="enhpt"></div></div>
      <div class="shadow se"></div><div class="shadow sp"></div>
      <div class="ent en" id="en"><div class="tintw" style="transform:scaleX(-1)">${artOf(CHARS[O.st.char].art)}</div></div>
      <div class="ent pl" id="pl">${artOf(CHARS[M.st.char].art)}</div>
      <div class="plate p"><div class="row"><b>${esc(M.name)}</b><span>SPD ${M.st.spd}</span></div>
        <div class="bar hp"><i id="plhp"></i></div><div class="small" id="plt"></div></div>
    </div>
    <div class="card" id="log"></div>
    <div class="card" id="ctrl"></div>`;
}
function pvpRefresh(){
  const r = PV.room; if(!r || view !== 'pvpb' || !$('scene')) return;
  const me = PV.me, o = opp(me);
  $('enhp').style.width = pct(r.hp[o], r[o].st.hp); $('enhpt').textContent = `HP ${Math.max(0, r.hp[o])}/${r[o].st.hp}`;
  $('plhp').style.width = pct(r.hp[me], r[me].st.hp); $('plt').textContent = `HP ${Math.max(0, r.hp[me])}/${r[me].st.hp}`;
  $('pl').classList.toggle('guard', !!r.guard[me]); $('en').classList.toggle('guard', !!r.guard[o]);
  const sh = r.shield || {}; $('pl').classList.toggle('blessed', !!sh[me]); $('en').classList.toggle('blessed', !!sh[o]);
  const lg = $('log'); lg.innerHTML = PV.log.slice(-30).map(l => `<div>${l}</div>`).join(''); lg.scrollTop = lg.scrollHeight;
  $('ctrl').innerHTML = pvpControls();
  document.body.classList.toggle('locked', PV.anim);
}
function pvpControls(){
  const r = PV.room, me = PV.me;
  if(r.status === 'done'){
    const won = r.winner === me;
    return `<div class="turnlbl ${won?'go':''}" style="font-size:16px">${won ? '🏆 YOU WIN!' : r.winner ? '💀 You lost…' : 'Room closed'}</div>
      <div class="btns"><button onclick="go('home')">${IC.home} Home</button><button onclick="go('lb')">🏆 Leaderboard</button><button class="pri" onclick="pvpLeave()">${IC.sword} New battle</button></div>`;
  }
  const mine = r.turn === me && !PV.anim, left = Math.max(0, Math.ceil((r.deadline - Date.now())/1000));
  const dis = mine ? '' : 'disabled', mycd = r.cd[me] || {};
  const sk = CHARS[r[me].st.char].skills.map((id,i) => { const k = SKILLS[id], cd = mycd[id]||0;
    return `<button class="${cd?'cooling':''}" onclick="pvpAct('${id}')" ${dis || (cd?'disabled':'')}>${sIcon(id)} ${k.n}${
      cd ? ` <small class="cdc">${cd}</small>` : (CD[i] ? ` <small class="cdt">${CD[i]}T</small>` : '')}</button>`; }).join('');
  return `<div class="turnlbl ${mine?'go':''}">${mine ? `Your turn! ⏱ ${left}s` : `⏳ ${esc(r[opp(me)].name)}'s turn… ⏱ ${left}s`}</div>
    <div class="btns">${sk}
      <button disabled>${IC.bag} No potions (PVP)</button>
      <button class="warn" onclick="pvpForfeit()">${IC.run} Give up</button></div>`;
}
let pvpForfeitArm = false;
function pvpForfeit(){
  if(!pvpForfeitArm){ pvpForfeitArm = true; PV.log.push('Tap <b>Give up</b> again to forfeit.'); pvpRefresh(); setTimeout(() => pvpForfeitArm = false, 3000); return; }
  pvpForfeitArm = false; pvpLeave();
}

// work out one action (used by the acting player, or by the waiting player when the other times out)
function pvpResolve(r, actor, id, auto){
  const tgt = opp(actor), A = r[actor].st, T = r[tgt].st, K = SKILLS[id], idx = CHARS[A.char].skills.indexOf(id);
  const hp = { ...r.hp }, cd = { p1:{...(r.cd.p1||{})}, p2:{...(r.cd.p2||{})} }, guard = { ...r.guard };
  const shield = { p1:(r.shield||{}).p1 || null, p2:(r.shield||{}).p2 || null };
  const res = { seq:r.seq + 1, by:actor, skill:id, kind:K.kind, dmg:0, heal:0, crit:false };
  if(K.kind === 'hit'){
    res.crit = Math.random()*100 < A.crit;
    let d = Math.round(A.atk * K.mult) * (res.crit ? 2 : 1);
    d = d * (1 - T.def/100);
    if(guard[tgt]){ d *= (1 - guard[tgt]); guard[tgt] = 0; res.blocked = true; }
    if(shield[tgt]){ d *= (1 - shield[tgt].v); res.blocked = true; }
    res.dmg = Math.max(1, Math.round(d)); hp[tgt] = Math.max(0, hp[tgt] - res.dmg);
    if(K.stun && hp[tgt] > 0 && Math.random() < K.stun) res.stun = true;
  } else if(K.kind === 'heal'){
    const b = hp[actor]; hp[actor] = Math.min(A.hp, hp[actor] + Math.round(A.atk * K.healAtk)); res.heal = hp[actor] - b;
  } else if(K.kind === 'guard' && K.dur){ shield[actor] = { v:K.block, n:K.dur }; }
  else if(K.kind === 'guard'){ guard[actor] = K.block; }
  // a lasting shield loses one turn each time the other player acts
  if(shield[tgt]){ shield[tgt] = shield[tgt].n > 1 ? { v:shield[tgt].v, n:shield[tgt].n - 1 } : null; }
  // cooldowns: every skill ticks down one turn, then the used one starts its cooldown
  for(const s in cd[actor]) if(cd[actor][s] > 0) cd[actor][s]--;
  if(CD[idx]) cd[actor][id] = CD[idx];
  if(K.cutCd){ const s = CHARS[A.char].skills[K.cutCd[0]]; if(cd[actor][s] > 0) cd[actor][s] = Math.max(0, cd[actor][s] - K.cutCd[1]); }
  if(K.resetCd){ const s = CHARS[A.char].skills[K.resetCd]; cd[actor][s] = 0; }
  const nm = r[actor].name;
  const idle = { ...(r.idle || {}) }; idle[actor] = auto ? (idle[actor] || 0) + 1 : 0;
  res.text = (auto ? `⏱ ${nm} ran out of time — ` : '') + (K.kind === 'hit' ? `${nm} uses ${K.n}${res.crit ? ' — CRITICAL' : ''}! ${res.dmg} damage${res.blocked ? ' (blocked some)' : ''}`
           : K.kind === 'heal' ? `${nm} uses ${K.n} and heals ${res.heal} HP`
           : K.dur ? `${nm} uses ${K.n} — ${K.block*100}% less damage for ${K.dur} turns` : `${nm} uses ${K.n} and raises a guard`);
  if(res.stun) res.text += ` ⚡ ${r[tgt].name} is stunned and loses a turn!`;
  if(res.stun && K.stunReset){ cd[actor][id] = 0; res.text += ` ${K.n} cooldown reset!`; }
  const upd = { hp, cd, guard, shield, idle, seq:res.seq, last:res, turn:res.stun ? actor : tgt, deadline:Date.now() + PVP_TURN_MS };
  if(hp[tgt] <= 0){ upd.status = 'done'; upd.winner = actor; }
  else if(idle[actor] >= 3){ upd.status = 'done'; upd.winner = tgt; res.text += ` — ${nm} was away for 3 turns and loses.`; }
  return upd;
}
async function pvpAct(id, auto, timedOut){
  const r = PV.room, me = PV.me;
  if(!r || r.status !== 'playing' || PV.anim) return;
  const actor = auto ? opp(me) : me;
  if(r.turn !== actor) return;
  if(!auto && !timedOut && (r.cd[me]||{})[id]) return;
  PV.anim = true; pvpRefresh();
  try{
    await FB.F.runTransaction(FB.db, async tx => {
      const snap = await tx.get(roomRef(PV.code)), cur = snap.data();
      if(cur.status !== 'playing' || cur.turn !== actor || cur.seq !== r.seq) throw new Error('stale');
      tx.update(roomRef(PV.code), pvpResolve(cur, actor, id, auto || timedOut));
    });
    PV.lastSync = 0; setTimeout(pvpSync, 1500);   // make sure we see the result even if the live update is slow
  }catch(e){ PV.anim = false; pvpRefresh(); pvpSync(); }
}
// ask the server for the latest room (in case the live connection dropped or lagged)
async function pvpSync(){
  const code = PV.code; if(!code || PV.syncing) return; PV.syncing = true;
  try{ const s = await FB.F.getDoc(roomRef(code)); if(PV.code === code && s.exists()){ const d = s.data();
    if(!PV.room || d.seq > PV.room.seq || d.status !== PV.room.status){ PV.room = d; if(view === 'pvpb') pvpOnUpdate(); }
    else if(PV.anim && !PV.playing){ PV.anim = false; pvpRefresh(); } } }catch(e){}
  PV.syncing = false; PV.lastSync = Date.now();
}
// the waiting player's game makes the idle player do a normal attack when their 30 s run out
function pvpTick(){
  const r = PV.room;
  if(!r || view !== 'pvpb') return;
  if(r.status === 'playing' && !PV.anim && r.turn !== PV.me && Date.now() > r.deadline + 2000){
    pvpAct(CHARS[r[r.turn].st.char].skills[0], true);
  } else if(r.status === 'playing' && !PV.anim && r.turn === PV.me && Date.now() > r.deadline){
    pvpAct(CHARS[r[PV.me].st.char].skills[0], false, true);   // my own time ran out
  }
  if(r.status === 'playing' && !PV.playing && Date.now() - (PV.lastSync || 0) > 4000) pvpSync();   // backup check every few seconds
  const t = document.querySelector('#ctrl .turnlbl');
  if(t && r.status === 'playing' && !PV.anim){ const left = Math.max(0, Math.ceil((r.deadline - Date.now())/1000));
    t.innerHTML = r.turn === PV.me ? `Your turn! ⏱ ${left}s` : `⏳ ${esc(r[r.turn].name)}'s turn… ⏱ ${left}s`; }
}
// play the newest action as an animation, then update the screen
async function pvpOnUpdate(){
  if(PV.playing){ PV.again = true; return; }       // an animation is running: show this one right after
  const r = PV.room, L = r && r.last, code = PV.code;
  if(!L || L.seq <= PV.seqSeen){ pvpRefresh(); return; }
  PV.seqSeen = L.seq; PV.playing = true;
  if(!$('scene')){ render(); }
  if(L.by){
    PV.anim = true; pvpRefresh();
    const mine = L.by === PV.me, A = mine ? $('pl') : $('en'), T = mine ? $('en') : $('pl'), K = SKILLS[L.skill], dir = mine ? 1 : -1;
    if(L.kind === 'hit'){
      if(mine && K.anim === 'thrust') await thrustAnim(A, T);
      else if(mine && K.anim === 'slam') await slamAnim(A, [T]);
      else if(K.anim === 'orb') await orbAnim(A, T);
      else if(K.anim === 'bolt') await boltAnim(A, T);
      else if(K.anim === 'storm') await stormAnim(A, [T]);
      else { if(CD[CHARS[r[L.by].st.char].skills.indexOf(L.skill)]) await charge(A, K.color || '#fff'); await lunge(A, dir, K.big); }
      if(K.ult){ await rapidHits(T, L.dmg, K, L.crit); }
      else {
      if(!K.anim || K.anim === 'orb' || (!mine && (K.anim === 'thrust' || K.anim === 'slam'))) slash(T, K.color || (L.crit ? '#ffd54a' : '#ffffffcc'), K.big || L.crit);
      hitFx(T); SFX.play(L.crit ? 'crit' : 'hit');
      burst(T, K.fx || 'spark', L.crit ? 8 : 5, 60, L.crit ? '#ffd54a' : (K.color || '#fff'));
      floatText(T, L.crit ? `CRIT -${L.dmg}` : `-${L.dmg}`, L.crit ? 'crit' : '');
      if(L.crit || K.big) shakeScene();
      }
      if(L.stun) stunFx(T);
    } else if(L.kind === 'guard' && K.dur){
      await blessAnim(A);
    } else if(L.kind === 'heal'){
      if(K.ult) await rapidHeal(A, L.heal, K);
      else { charge(A, '#8fd14f'); SFX.play('heal'); rise(A, 'plus', 9, '#b8ff5a'); floatText(A, `+${L.heal}`, 'heal'); await wait(500); }
    } else if(L.kind === 'guard'){
      SFX.play('guard'); if(K.anim === 'shield') cls(A, 'shieldup', 600); floatText(A, 'GUARD', 'mp'); await wait(450);
    }
  }
  PV.log.push(L.text);
  if(r.status === 'done' && r.winner){
    const won = r.winner === PV.me;
    await wait(300);
    pvpRecord(PV.code);
    if(won){ await deathFx($('en')); SFX.play('win'); PV.log.push('🏆 You win!'); }
    else { await fallFx(); SFX.play('lose'); PV.log.push('💀 You lost this time.'); }
  }
  PV.playing = false;
  if(PV.code !== code) return;
  PV.anim = false; pvpRefresh();
  if(PV.again){ PV.again = false; pvpOnUpdate(); }
}

// ---- Leaderboard: one shared document rooms/_leaderboard = { p:{ uid:{name,w,l} } } ----
// The room gets "recorded:true" in the same transaction, so a match is only counted once.
async function pvpRecord(code){
  if(!FB.ok || !code) return;
  try{
    await FB.F.runTransaction(FB.db, async tx => {
      const rs = await tx.get(roomRef(code)), ls = await tx.get(lbRef());
      const r = rs.data();
      if(!r || r.recorded || r.status !== 'done' || !r.winner || !r.p2) return;
      const p = (ls.exists() && ls.data().p) || {};
      const add = (who, win) => { const u = r[who]; const e = p[u.uid] || { name:u.name, w:0, l:0 }; e.name = u.name; win ? e.w++ : e.l++; p[u.uid] = e; };
      add(r.winner, true); add(opp(r.winner), false);
      tx.set(lbRef(), { p, updated:Date.now() });
      tx.update(roomRef(code), { recorded:true });
    });
  }catch(e){}
}
async function lbLoad(){
  LB.err = '';
  if(!FB.ok){ LB.err = 'Online services are not available right now.'; render(); return; }
  try{
    const s = await FB.F.getDoc(lbRef()), p = (s.exists() && s.data().p) || {};
    LB.list = Object.entries(p).map(([uid,e]) => ({ uid, ...e }))
      .sort((a,b) => b.w - a.w || a.l - b.l || a.name.localeCompare(b.name));
  }catch(e){ LB.err = 'Could not load the leaderboard — check your internet.'; }
  if(view === 'lb') render();
}
function leaderboard(){
  if(LB.list === null && !LB.err){ setTimeout(lbLoad, 0); return `<div class="card"><h2>🏆 PVP Leaderboard</h2><p class="small">Loading…</p>${back()}</div>`; }
  const me = FB.user && FB.user.uid, L = LB.list || [];
  const medal = i => ['🥇','🥈','🥉'][i] || (i+1);
  let rows = L.slice(0,50).map((e,i) => `<tr class="${e.uid===me?'me':''}"><td class="rk">${medal(i)}</td><td>${esc(e.name)}</td><td>${e.w}</td><td>${e.l}</td><td>${Math.round(e.w/Math.max(1,e.w+e.l)*100)}%</td></tr>`).join('');
  const mine = me && L.findIndex(e => e.uid === me);
  return `<div class="card"><h2>🏆 PVP Leaderboard</h2>
    ${LB.err ? `<p class="msg">${LB.err}</p>` : L.length ? `<table class="lb"><tr><th>#</th><th>Player</th><th>W</th><th>L</th><th>Win%</th></tr>${rows}</table>`
      : '<div class="story">No PVP battles yet. Be the first on the board!</div>'}
    ${mine > 49 ? `<p class="small">Your rank: #${mine+1}</p>` : ''}
    <div class="btns"><button onclick="LB.list=null;render()">↻ Refresh</button><button class="pri" onclick="go('pvp')">${IC.sword} PVP</button></div>
    ${back()}</div>`;
}
document.addEventListener('visibilitychange', () => { if(document.visibilityState === 'visible' && PV.code) pvpSync(); });

function sceneFlash(col='#fff9c4', a=.55){
  const s = $('scene'); if(!s) return;
  const f = document.createElement('div'); f.className = 'flash'; f.style.background = col; s.appendChild(f);
  an(f, [{opacity:a},{opacity:0}], {duration:380, easing:'ease-out'}).then(() => f.remove());
}
async function castPose(P){ swing(P, 500); await charge(P, '#b388ff'); }
async function orbAnim(P, E){

// ---- Gacha: summon the Mage ----
const GACHA_COST = 200, GACHA10_COST = 1800, GACHA_RATE = .05;
const GACHA_PRIZES = [   // what the other 95% give (chance out of the 95%)
  { w:55, n:'3 Magic Powder', give:() => S.powder += 3,          ic:() => IC.powder },
  { w:25, n:'Health Potion',  give:() => S.inv.potion = (S.inv.potion||0) + 1, ic:() => ITEMS.potion.icon() },
  { w:10, n:'Power Potion',   give:() => S.inv.power  = (S.inv.power||0) + 1,  ic:() => ITEMS.power.icon() },
  { w:10, n:'Iron Skin Potion', give:() => S.inv.iron = (S.inv.iron||0) + 1,   ic:() => ITEMS.iron.icon() }
];
const GA = { res:null, rolling:false };
function gacha(){
  const c = CHARS.mage, own = S.chars.includes('mage') && !GA.rolling;
  const skills = c.skills.map((id,i) => `<div class="gsk" onclick="showcase('${id}')">${sIcon(id)}<div><b>${SKILLS[id].n}</b> <span class="small">${i ? (CD[i] + 'T cooldown') : 'Normal'}</span><div class="small">${SKILLS[id].d}</div></div></div>`).join('');
  let res = '';
  if(GA.res){
    res = `<div class="gres ${GA.res.length > 1 ? 'ten' : ''}">${GA.res.map((r,i) => `<div class="gr ${r.mage ? 'win' : ''}" style="animation-delay:${i*.09}s">${r.mage ? artOf('mage') : r.ic()}<span>${r.n}</span></div>`).join('')}</div>`;
  }
  return `<div class="card gacha"><h2>✨ Mage Summon</h2>
    <div class="gstage" id="gstage">
      <div class="gcircle"></div>
      <div class="gprev" id="gprev">${artOf('mage')}</div>
      <div class="grate">Mage chance <b>5%</b></div>
    </div>
    <div class="row small" style="justify-content:center;gap:14px;margin:6px 0">
      <span>HP ${c.hp}</span><span>ATK ${c.atk}</span><span>SPD ${c.spd}</span><span>DEF ${c.def}%</span><span>CRIT 20%</span></div>
    <div class="small" style="text-align:center">Tap a skill to watch it ▶</div><div class="gskills">${skills}</div>
    ${res}
    ${own ? `<div class="turnlbl go" style="font-size:15px">✔ You own the Mage!</div><button class="pri full" onclick="GA.res=null;go('set')">⚔ Go to Formation</button>`
      : `<div class="btns"><button class="pri" onclick="pull(1)" ${S.gold < GACHA_COST || GA.rolling ? 'disabled' : ''}>Summon ×1<br><small>${IC.coin} ${GACHA_COST}</small></button>
        <button class="pri gold10" onclick="pull(10)" ${S.gold < GACHA10_COST || GA.rolling ? 'disabled' : ''}>Summon ×10<br><small>${IC.coin} ${GACHA10_COST}</small></button></div>
        <p class="small">Not the Mage? You still get a prize: 3 Magic Powder, a Health Potion, a Power Potion or an Iron Skin Potion.</p>`}
    <button class="full" onclick="GA.res=null;go('set')">${IC.back} Characters</button></div>`;
}
async function pull(n){
  const cost = n === 10 ? GACHA10_COST : GACHA_COST;
  if(GA.rolling || S.gold < cost || S.chars.includes('mage')) return;
  S.gold -= cost; GA.rolling = true; GA.res = null;
  const out = [];
  for(let i = 0; i < n; i++){
    if(!out.some(r => r.mage) && Math.random() < GACHA_RATE){ out.push({ mage:true, n:'MAGE!' }); continue; }
    let x = Math.random() * 100;
    const p = GACHA_PRIZES.find(p => (x -= p.w) < 0) || GACHA_PRIZES[0];
    p.give(); out.push({ n:p.n, ic:p.ic });
  }
  const won = out.some(r => r.mage);
  if(won){ S.chars.push('mage'); }
  save(); render();
  document.body.classList.add('locked');
  // summon animation: the circle spins up, lightning, flash
  const st = $('gstage'); st.classList.add('rolling'); SFX.play('gacha');
  await wait(1300);
  if(won){ st.classList.add('jackpot'); SFX.play('zap'); await wait(250); SFX.play('jackpot'); await wait(700); }
  else { SFX.play('poof'); await wait(300); }
  document.body.classList.remove('locked');
  GA.rolling = false; GA.res = out;
  msg = won ? '⚡ The Mage answered your call! She joined your party.' : `No Mage this time — you got ${out.length > 1 ? 'these prizes' : out[0].n}.`;
  render();
}

// ---- Ultimates (skill 3): a rapid flurry of small hits. The damage is the SAME — it's just split into pieces ----
function splitDmg(total, n){
  n = Math.max(1, Math.min(n, total));
  const w = Array.from({length:n}, () => .6 + Math.random()*.8), s = w.reduce((a,b) => a+b, 0);
  const parts = w.map(x => Math.max(1, Math.floor(total * x / s)));
  let diff = total - parts.reduce((a,b) => a+b, 0), i = 0;
  while(diff !== 0){ const k = i++ % n; if(diff > 0){ parts[k]++; diff--; } else if(parts[k] > 1){ parts[k]--; diff++; } }
  return parts;
}
function hitNum(el, t, cls){
  const c = center(el), dx = (Math.random()-.5)*70, dy = (Math.random()-.5)*40;
  const d = spawn('ft hitn ' + cls, t, c.x + dx, c.y - 30 + dy);
  an(d, [{transform:'translate(-50%,0) scale(1.6)',opacity:0},{transform:'translate(-50%,-6px) scale(1)',opacity:1,offset:.15},
         {transform:'translate(-50%,-38px) scale(.9)',opacity:0}], {duration:750,easing:'ease-out'}).then(() => d.remove());
}
function chip(el, color, n=5){   // tiny glowing shards flying out
  const c = center(el);
  for(let i=0;i<n;i++){
    const a = Math.random()*Math.PI*2, r = 30 + Math.random()*55, d = spawn('pt shard', '', c.x + (Math.random()-.5)*30, c.y + (Math.random()-.5)*30);
    d.style.setProperty('--c', color); d.style.rotate = (a*57) + 'deg';
    an(d, [{transform:'translate(-50%,-50%) scale(1)',opacity:1},{transform:`translate(calc(-50% + ${Math.cos(a)*r}px),calc(-50% + ${Math.sin(a)*r}px)) scale(.2)`,opacity:0}],
       {duration:380+Math.random()*250,easing:'cubic-bezier(.1,.8,.3,1)'}).then(() => d.remove());
  }
}
async function rapidHits(el, total, K, crit, onPart){

// ---- PVP 2v2: four players, two teams (A and B). Room doc rooms/{CODE} with mode:'2v2' ----
// { mode:'2v2', code, status:'waiting'|'playing'|'done', host:uid, created,
//   seats:{a1,a2,b1,b2: null | {uid,name,st}}, order:[seat...], turn:seat, hp:{seat:n}, cd:{seat:{}}, guard:{seat:n},
//   shield:{seat:{v,n}|null}, stun:{seat:bool}, idle:{seat:n}, seq, last, deadline, winner:'a'|'b', recorded }
const SEATS = ['a1','a2','b1','b2'];
const P2 = { code:null, me:null, room:null, unsub:null, seqSeen:0, log:[], anim:false, playing:false, again:false, timer:null, target:null, busy:false, err:'' };
const sideOf = s => s[0];
const foesOf = s => SEATS.filter(x => sideOf(x) !== sideOf(s));
const alive = (r, s) => r.seats[s] && r.hp[s] > 0;

async function pvp2Create(){
  if(!FB.ok || !FB.user || P2.busy) return;
  P2.busy = true; PV.err = ''; render();
  try{
    let code, tries = 0, ex;
    do{ code = pvpCodeGen(); ex = await FB.F.getDoc(roomRef(code)); tries++; } while(tries < 5 && ex.exists() && ex.data().status !== 'done');
    await FB.F.setDoc(roomRef(code), { mode:'2v2', code, status:'waiting', created:Date.now(), host:FB.user.uid,
      seats:{ a1:{ uid:FB.user.uid, name:CUR, st:pvpStats() }, a2:null, b1:null, b2:null }, seq:0 });
    pvp2Listen(code, 'a1'); view = 'pvp2';
  }catch(e){ PV.err = 'Could not create a room — check your internet.'; }
  P2.busy = false; render();
}
async function pvp2Join(code){
  P2.busy = true; render();
  let seat = null;
  try{
    await FB.F.runTransaction(FB.db, async tx => {
      const snap = await tx.get(roomRef(code)); const r = snap.data();
      if(r.status !== 'waiting') throw new Error('That room has already started or finished.');
      const mine = SEATS.find(s => r.seats[s] && r.seats[s].uid === FB.user.uid);
      if(mine){ seat = mine; return; }
      const cnt = side => SEATS.filter(s => sideOf(s) === side && r.seats[s]).length;
      const order = cnt('a') <= cnt('b') ? ['a1','a2','b1','b2'] : ['b1','b2','a1','a2'];
      seat = order.find(s => !r.seats[s]);
      if(!seat) throw new Error('That room is full (4/4).');
      tx.update(roomRef(code), { ['seats.' + seat]: { uid:FB.user.uid, name:CUR, st:pvpStats() } });
    });
    pvp2Listen(code, seat); view = 'pvp2';
  }catch(e){ PV.err = e.message && !e.code ? e.message : 'Could not join — check the code and your internet.'; }
  P2.busy = false; render();
}
async function pvp2Sit(to){
  const code = P2.code; if(!code || P2.busy) return;
  P2.busy = true;
  try{
    await FB.F.runTransaction(FB.db, async tx => {
      const r = (await tx.get(roomRef(code))).data();
      if(r.status !== 'waiting' || r.seats[to]) throw new Error('taken');
      const from = SEATS.find(s => r.seats[s] && r.seats[s].uid === FB.user.uid);
      if(!from) throw new Error('gone');
      tx.update(roomRef(code), { ['seats.' + to]: r.seats[from], ['seats.' + from]: null });
    });
    P2.me = to; SFX.play('click');
  }catch(e){}
  P2.busy = false;
}
async function pvp2Start(){
  const code = P2.code; if(!code || P2.busy) return;
  P2.busy = true;
  try{
    await FB.F.runTransaction(FB.db, async tx => {
      const r = (await tx.get(roomRef(code))).data();
      if(r.status !== 'waiting' || SEATS.some(s => !r.seats[s])) throw new Error('not full');
      const order = [...SEATS].sort((x,y) => r.seats[y].st.spd - r.seats[x].st.spd || SEATS.indexOf(x) - SEATS.indexOf(y));
      const hp = {}, cd = {}, guard = {}, shield = {}, stun = {}, idle = {};
      SEATS.forEach(s => { hp[s] = r.seats[s].st.hp; cd[s] = {}; guard[s] = 0; shield[s] = null; stun[s] = false; idle[s] = 0; });
      tx.update(roomRef(code), { status:'playing', order, turn:order[0], hp, cd, guard, shield, stun, idle, seq:1,
        deadline:Date.now() + PVP_TURN_MS, last:{ seq:1, text:`Battle start! ${r.seats[order[0]].name} is the fastest and moves first.` } });
    });
  }catch(e){}
  P2.busy = false;
}
function pvp2Listen(code, me){
  pvp2Stop();
  Object.assign(P2, { code, me, seqSeen:0, log:[], playing:false, again:false, anim:false, target:null, lastSync:Date.now() });
  P2.unsub = FB.F.onSnapshot(roomRef(code), snap => {
    if(P2.code !== code || !snap.exists()) return;
    const prev = P2.room; P2.room = snap.data();
    const mine = SEATS.find(s => P2.room.seats[s] && P2.room.seats[s].uid === FB.user.uid);
    if(mine) P2.me = mine;
    if(P2.room.status === 'waiting'){ if(view === 'pvp2') render(); return; }
    if(view === 'pvp2' || view === 'pvp2b'){
      if(view !== 'pvp2b' || !prev || prev.status === 'waiting'){ view = 'pvp2b'; pageAnim = true; render(); }
      pvp2OnUpdate();
    }
  });
  clearInterval(P2.timer); P2.timer = setInterval(pvp2Tick, 1000);
}
function pvp2Stop(){ if(P2.unsub) P2.unsub(); P2.unsub = null; clearInterval(P2.timer); P2.timer = null; }
async function pvp2Leave(silent){
  const code = P2.code, me = P2.me, r = P2.room;
  P2.code = null;
  pvp2Stop();
  if(code && r && FB.ok){
    try{
      await FB.F.runTransaction(FB.db, async tx => {
        const cur = (await tx.get(roomRef(code))).data();
        if(!cur) return;
        if(cur.status === 'waiting'){
          if(cur.host === FB.user.uid) tx.update(roomRef(code), { status:'done', winner:null });
          else tx.update(roomRef(code), { ['seats.' + me]: null });
        } else if(cur.status === 'playing' && cur.hp[me] > 0){
          const hp = { ...cur.hp, [me]:0 }, seq = cur.seq + 1;
          const upd = { hp, seq, last:{ seq, text:`${cur.seats[me].name} left the battle.` } };
          const win = pvp2Winner({ ...cur, hp });
          if(win){ upd.status = 'done'; upd.winner = win; }
          else if(cur.turn === me){ const nx = pvp2Next({ ...cur, hp }, me); Object.assign(upd, { turn:nx.turn, stun:nx.stun, deadline:Date.now() + PVP_TURN_MS }); }
          tx.update(roomRef(code), upd);
        }
      });
      await pvp2Record(code);
    }catch(e){}
  }
  P2.room = null; P2.me = null;
  document.body.classList.remove('locked');
  if(!silent){ view = 'pvp'; render(); }
}

// ---- rules ----
function pvp2Winner(r){
  const a = ['a1','a2'].some(s => r.hp[s] > 0), b = ['b1','b2'].some(s => r.hp[s] > 0);
  return !a ? 'b' : !b ? 'a' : null;
}
function pvp2Next(r, from){   // next living player in speed order; stunned players lose that turn
  const stun = { ...r.stun }, skipped = [];
  let i = r.order.indexOf(from);
  for(let k = 0; k < 8; k++){
    i = (i + 1) % r.order.length; const s = r.order[i];
    if(r.hp[s] <= 0) continue;
    if(stun[s]){ stun[s] = false; skipped.push(s); continue; }
    return { turn:s, stun, skipped };
  }
  return { turn:from, stun, skipped };
}
function pvp2Resolve(r, actor, id, target, auto){
  const K = SKILLS[id], A = r.seats[actor].st, idx = CHARS[A.char].skills.indexOf(id);
  const hp = { ...r.hp }, guard = { ...r.guard }, stun = { ...r.stun }, idle = { ...r.idle };
  const shield = {}; SEATS.forEach(s => shield[s] = r.shield[s] ? { ...r.shield[s] } : null);
  const cd = {}; SEATS.forEach(s => cd[s] = { ...(r.cd[s] || {}) });
  // the actor's own lasting shield counts down at the start of their turn
  if(shield[actor]){ shield[actor] = shield[actor].n > 1 ? { v:shield[actor].v, n:shield[actor].n - 1 } : null; }
  const foes = foesOf(actor).filter(s => hp[s] > 0);
  if(!foes.includes(target)) target = foes[0];
  const res = { seq:r.seq + 1, by:actor, skill:id, kind:K.kind, hits:[], heal:0 };
  const nm = r.seats[actor].name;
  let text = (auto ? `⏱ ${nm} ran out of time — ` : '') + `${nm} uses ${K.n}`;
  if(K.kind === 'hit'){
    const tg = K.aoe ? foes : [target];
    const parts = [];
    tg.forEach(t => {
      const T = r.seats[t].st, crit = Math.random()*100 < A.crit;
      let d = Math.round(A.atk * K.mult) * (crit ? 2 : 1) * (1 - T.def/100);
      if(guard[t]){ d *= (1 - guard[t]); guard[t] = 0; }
      if(shield[t]) d *= (1 - shield[t].v);
      d = Math.max(1, Math.round(d)); hp[t] = Math.max(0, hp[t] - d);
      const st = !!(K.stun && hp[t] > 0 && Math.random() < K.stun);
      if(st) stun[t] = true;
      res.hits.push({ t, dmg:d, crit, stun:st });
      parts.push(`${r.seats[t].name} -${d}${crit ? ' (CRIT)' : ''}${st ? ' ⚡stunned' : ''}`);
    });
    text += ': ' + parts.join(', ');
  } else if(K.kind === 'heal'){
    const b = hp[actor]; hp[actor] = Math.min(A.hp, hp[actor] + Math.round(A.atk * K.healAtk)); res.heal = hp[actor] - b;
    text += ` and heals ${res.heal} HP`;
  } else if(K.dur){ shield[actor] = { v:K.block, n:K.dur }; text += ` — ${K.block*100}% less damage for ${K.dur} turns`; }
  else { guard[actor] = K.block; text += ' and raises a guard'; }
  for(const s in cd[actor]) if(cd[actor][s] > 0) cd[actor][s]--;
  if(CD[idx]) cd[actor][id] = CD[idx];
  if(K.cutCd){ const s = CHARS[A.char].skills[K.cutCd[0]]; if(cd[actor][s] > 0) cd[actor][s] = Math.max(0, cd[actor][s] - K.cutCd[1]); }
  if(K.resetCd){ cd[actor][CHARS[A.char].skills[K.resetCd]] = 0; }
  if(K.stunReset && res.hits.some(h => h.stun)){ cd[actor][id] = 0; text += ` — ${K.n} cooldown reset!`; }
  idle[actor] = auto ? (idle[actor] || 0) + 1 : 0;
  if(idle[actor] >= 3){ hp[actor] = 0; text += ` — ${nm} was away for 3 turns and is out!`; }
  const nr = { ...r, hp, stun };
  const upd = { hp, cd, guard, shield, idle, seq:res.seq, last:res };
  const win = pvp2Winner(nr);
  if(win){ upd.status = 'done'; upd.winner = win; upd.stun = stun; }
  else {
    const nx = pvp2Next(nr, actor);
    upd.turn = nx.turn; upd.stun = nx.stun; upd.deadline = Date.now() + PVP_TURN_MS;
    if(nx.skipped.length) text += ' · ' + nx.skipped.map(s => `${r.seats[s].name} is stunned and skips a turn`).join(' · ');
  }
  res.text = text;
  return upd;
}
async function pvp2Act(id, auto, timedOut){
  const r = P2.room; if(!r || r.status !== 'playing' || P2.anim) return;
  const actor = auto ? r.turn : P2.me;
  if(r.turn !== actor) return;
  if(!auto && !timedOut && (r.cd[actor] || {})[id]) return;
  const target = auto || timedOut ? null : P2.target;
  P2.anim = true; pvp2Refresh();
  try{
    await FB.F.runTransaction(FB.db, async tx => {
      const cur = (await tx.get(roomRef(P2.code))).data();
      if(cur.status !== 'playing' || cur.turn !== actor || cur.seq !== r.seq) throw new Error('stale');
      tx.update(roomRef(P2.code), pvp2Resolve(cur, actor, id, target, auto || timedOut));
    });
    P2.lastSync = 0; setTimeout(pvp2Sync, 1500);
  }catch(e){ P2.anim = false; pvp2Refresh(); pvp2Sync(); }
}
async function pvp2Sync(){
  const code = P2.code; if(!code || P2.syncing) return; P2.syncing = true;
  try{ const s = await FB.F.getDoc(roomRef(code)); if(P2.code === code && s.exists()){ const d = s.data();
    if(!P2.room || d.seq > P2.room.seq || d.status !== P2.room.status){ P2.room = d; if(view === 'pvp2b') pvp2OnUpdate(); else if(view === 'pvp2') render(); }
    else if(P2.anim && !P2.playing){ P2.anim = false; pvp2Refresh(); } } }catch(e){}
  P2.syncing = false; P2.lastSync = Date.now();
}
function pvp2Tick(){
  const r = P2.room; if(!r) return;
  if(r.status === 'waiting'){ if(Date.now() - (P2.lastSync || 0) > 5000) pvp2Sync(); return; }
  if(view !== 'pvp2b') return;
  if(r.status === 'playing' && !P2.anim){
    const basic = s => CHARS[r.seats[s].st.char].skills[0];
    if(r.turn === P2.me && Date.now() > r.deadline) pvp2Act(basic(P2.me), false, true);
    else if(r.turn !== P2.me && Date.now() > r.deadline + 2000) pvp2Act(basic(r.turn), true);
  }
  if(r.status === 'playing' && !P2.playing && Date.now() - (P2.lastSync || 0) > 4000) pvp2Sync();
  const t = document.querySelector('#ctrl .turnlbl');
  if(t && r.status === 'playing' && !P2.anim){ const left = Math.max(0, Math.ceil((r.deadline - Date.now())/1000));
    t.innerHTML = r.turn === P2.me ? `Your turn! ⏱ ${left}s` : `⏳ ${esc(r.seats[r.turn].name)}'s turn… ⏱ ${left}s`; }
}
async function pvp2Record(code){
  if(!FB.ok || !code) return;
  try{
    await FB.F.runTransaction(FB.db, async tx => {
      const rs = await tx.get(roomRef(code)), ls = await tx.get(lbRef());
      const r = rs.data();
      if(!r || r.recorded || r.status !== 'done' || !r.winner) return;
      const p = (ls.exists() && ls.data().p) || {};
      SEATS.forEach(s => { const u = r.seats[s]; if(!u) return;
        const e = p[u.uid] || { name:u.name, w:0, l:0 }; e.name = u.name; sideOf(s) === r.winner ? e.w++ : e.l++; p[u.uid] = e; });
      tx.set(lbRef(), { p, updated:Date.now() });
      tx.update(roomRef(code), { recorded:true });
    });
  }catch(e){}
}

// ---- lobby ----
function pvp2Lobby(){
  const r = P2.room;
  if(!r) return `<div class="card"><h2>2v2 Room</h2><p class="small">Connecting…</p><button class="full" onclick="pvp2Leave()">${IC.back} Back</button></div>`;
  const full = SEATS.every(s => r.seats[s]), host = r.host === FB.user.uid;
  const seat = s => { const u = r.seats[s];
    if(!u) return `<button class="seat empty" onclick="pvp2Sit('${s}')">＋<small>Tap to sit</small></button>`;
    return `<div class="seat ${s === P2.me ? 'me' : ''}"><span class="sart">${artOf(CHARS[u.st.char].art)}</span><b>${esc(u.name)}</b>
      <small>${CHARS[u.st.char].n} · SPD ${u.st.spd}</small>${u.uid === r.host ? '<span class="hosttag">HOST</span>' : ''}</div>`; };
  return `<div class="card"><h2>⚔ 2v2 Room</h2>
    <div class="story" style="text-align:center">Room code<div class="roomcode">${P2.code}</div>Send the code to 3 friends. Tap an empty seat to switch teams.</div>
    <div class="teams"><div class="team ta"><h3>Team A</h3>${seat('a1')}${seat('a2')}</div>
      <div class="vs small2">VS</div>
      <div class="team tb"><h3>Team B</h3>${seat('b1')}${seat('b2')}</div></div>
    ${host ? `<button class="pri full" onclick="pvp2Start()" ${full ? '' : 'disabled'}>${IC.sword} ${full ? 'Start battle!' : `Waiting for players (${SEATS.filter(s => r.seats[s]).length}/4)`}</button>`
           : `<div class="turnlbl">${full ? '⏳ Waiting for the host to start…' : `Waiting for players (${SEATS.filter(s => r.seats[s]).length}/4)`}</div>`}
    <div class="btns"><button onclick="copyRoom2()">${IC.copy} Copy code</button><button class="warn" onclick="pvp2Leave()">Leave room</button></div></div>`;
}
function copyRoom2(){ try{ navigator.clipboard.writeText(P2.code); msg = 'Code copied!'; }catch(e){} render(); }

// ---- battle ----
function pvp2Battle(){
  const r = P2.room, my = sideOf(P2.me);
  const L = SEATS.filter(s => sideOf(s) === my), R = SEATS.filter(s => sideOf(s) !== my);
  const ent = (s, pos) => { const u = r.seats[s];
    return `<div class="ent e2 ${pos}" id="u_${s}" onclick="pvp2Target('${s}')">
      <div class="mp2"><b>${esc(u.name)}${s === P2.me ? ' (you)' : ''}</b><div class="bar hp"><i id="hp_${s}"></i></div></div>
      <div class="tintw" ${pos[0] === 'r' ? 'style="transform:scaleX(-1)"' : ''}>${artOf(CHARS[u.st.char].art)}</div></div>`; };
  return `<div class="scene s2" id="scene">${forestBG()}${ambient()}
      ${ent(L[1],'l2')}${ent(L[0],'l1')}${ent(R[1],'r2')}${ent(R[0],'r1')}
    </div>
    <div class="card" id="log"></div>
    <div class="card" id="ctrl"></div>`;
}
function pvp2Target(s){
  const r = P2.room; if(!r || r.status !== 'playing' || sideOf(s) === sideOf(P2.me) || r.hp[s] <= 0) return;
  P2.target = s; SFX.play('click'); pvp2Refresh();
}
function pvp2Refresh(){
  const r = P2.room; if(!r || view !== 'pvp2b' || !$('scene')) return;
  const foes = foesOf(P2.me).filter(s => r.hp[s] > 0);
  if(!foes.includes(P2.target)) P2.target = foes[0] || null;
  SEATS.forEach(s => { const el = $('u_' + s); if(!el) return; const m = r.seats[s].st.hp;
    $('hp_' + s).style.width = pct(r.hp[s], m);
    el.classList.toggle('dead', r.hp[s] <= 0); el.classList.toggle('turn', r.status === 'playing' && r.turn === s);
    el.classList.toggle('tgt', s === P2.target && r.status === 'playing'); el.classList.toggle('guard', !!r.guard[s]);
    el.classList.toggle('blessed', !!r.shield[s]); el.classList.toggle('stunned', !!r.stun[s]);
    el.title = `HP ${Math.max(0, r.hp[s])}/${m}`;
    const hb = el.querySelector('.mp2 b'); if(hb) hb.dataset.hp = `${Math.max(0, r.hp[s])}`; });
  const lg = $('log'); lg.innerHTML = P2.log.slice(-30).map(l => `<div>${l}</div>`).join(''); lg.scrollTop = lg.scrollHeight;
  $('ctrl').innerHTML = pvp2Controls();
  document.body.classList.toggle('locked', P2.anim);
}
function pvp2Controls(){
  const r = P2.room, me = P2.me;
  if(r.status === 'done'){
    const won = r.winner === sideOf(me);
    return `<div class="turnlbl ${won?'go':''}" style="font-size:16px">${won ? '🏆 YOUR TEAM WINS!' : r.winner ? '💀 Your team lost…' : 'Room closed'}</div>
      <div class="btns"><button onclick="go('home')">${IC.home} Home</button><button onclick="go('lb')">🏆 Leaderboard</button>
      <button class="pri" onclick="pvp2Leave()">${IC.sword} New battle</button></div>`;
  }
  const out = r.hp[me] <= 0, mine = r.turn === me && !P2.anim && !out, left = Math.max(0, Math.ceil((r.deadline - Date.now())/1000));
  const dis = mine ? '' : 'disabled', mycd = r.cd[me] || {};

        else if(K.anim === 'orb') await orbAnim(A, Ts[0]);
        else if(K.anim === 'bolt') await boltAnim(A, Ts[0]);
        else if(K.anim === 'storm') await stormAnim(A, Ts);
        else { if(CD[CHARS[r.seats[L.by].st.char].skills.indexOf(L.skill)]) await charge(A, K.color || '#fff'); await lunge(A, dir, K.big); }

  }

  if(s.inv.ether){ s.inv.power += s.inv.ether; delete s.inv.ether; }
  // old weapons/armor are refunded as gold
  (s.gear||[]).forEach(k => { if(!GEAR[k] && OLD_PRICES[k]) s.gold += OLD_PRICES[k]; });
  // items are now individual copies in a bag: {i:id, k:itemKey, up:upgrade, fu:fusion}
  if(!Array.isArray(o.bag)){
    s.bag = []; s.nid = 1;
    const oldUp = s.up || {}, oldEq = s.eq || [];
    (s.gear||[]).filter(k => GEAR[k]).forEach(k => s.bag.push({ i:s.nid++, k, up:Math.min(MAX_UP, oldUp[k]||0), fu:0 }));
    s.eq = oldEq.map(k => (s.bag.find(b => b.k === k) || {}).i).filter(Boolean);
  }
  s.bag = s.bag.filter(b => GEAR[b.k]);
  s.eq = (s.eq||[]).filter(id => s.bag.some(b => b.i === id)).slice(0,4);
  s.nid = Math.max(s.nid||1, ...s.bag.map(b => b.i + 1), 1);
  delete s.gear; delete s.up;
  delete s.w; delete s.mhp; delete s.batk; delete s.bdef;
  if(!Array.isArray(s.arts) || s.arts.length !== 2) s.arts = ['potion','power'];
  s.arts = s.arts.map(k => ITEMS[k] ? k : 'potion');
  delete s.mp; delete s.mmp; delete s.a;
  return s;
}

const gearStats = (it, up = it.up, fu = it.fu) => { const o = {}; for(const st in GEAR[it.k].s){ const v = GEAR[it.k].s[st]; o[st] = Math.round(v * (1 + .1*up) * (1 + .25*fu)); } return o; };

const upCost  = it => Math.round(GEAR[it.k].p * .3 * (it.up + 1));                    // gold (same as before)

function pickChar(k){ if(!CHARS[k]) return;
  if(!S.chars.includes(k) && CHARS[k].gacha){ go('gacha'); return; }

function buyChar(k){
  const c = CHARS[k]; if(!c || c.gacha || S.chars.includes(k)) return;
  if(S.gold < c.price){ msg = `Not enough gold — ${c.n} costs ${c.price} gold.`; render(); return; }
  S.gold -= c.price; S.chars.push(k); SFX.play('levelup');
  msg = `You recruited ${c.n}! Tap Deploy in Battle Formation to send them into battle.`; save(); render();
}
function equip(id){ const it = inst(id); if(!it || S.eq.includes(id) || S.eq.length >= 4) return;
  S.eq.push(id); msg = `Equipped ${itemName(it)}`; save(); render(); }
function unequip(id){ const it = inst(id); S.eq = S.eq.filter(x => x !== id); msg = it ? `Took off ${itemName(it)}` : ''; save(); render(); }
function sell(id){
  const it = inst(id); if(!it || S.eq.includes(id)) return;
  if(sellArm !== id){ sellArm = id; msg = `Tap <b>Sure?</b> to sell ${itemName(it)} for ${sellValue(it)} gold.`; render(); return; }
  sellArm = null;
  const v = sellValue(it); S.bag = S.bag.filter(b => b !== it); S.gold += v; SFX.play('coin');
  msg = `Sold ${itemName(it)} for ${v} gold.`; save(); render();
}
function sellPotion(k){
  if(!S.inv[k]) return;
  const v = potionSell(k); S.inv[k]--; S.gold += v; SFX.play('coin');
  msg = `Sold a ${ITEMS[k].n} for ${v} gold.`; save(); render();
}
function fuse(id){
  const it = inst(id); if(!it || !canFuse(it)) return;
  const m = fuseMat(it); S.bag = S.bag.filter(b => b !== m); it.fu++;
  SFX.play('levelup'); msg = `Fused! ${itemName(it)} — ${statTxt(gearStats(it))}`; save(); render();

function equipArt(k){
  if(S.arts.includes(k)) return;
  S.arts = [S.arts[1], k];          // newest replaces the oldest slot
  msg = `${ITEMS[k].n} added to your artifacts`; save(); render();

function upgrade(id){
  const it = inst(id); if(!it || !canUp(it)) return;
  S.gold -= upCost(it); S.powder -= upPowder(it); it.up++; SFX.play('upgrade');
  msg = `${GEAR[it.k].n} upgraded to +${it.up}!`; save(); render();
}

// ---- Online accounts (Firebase Auth + Firestore) ----
const FB = { ok:false, loading:true, user:null, pendingName:null, pendingStart:null };
async function fbInit(){
  try{
    const base = `https://www.gstatic.com/firebasejs/${FB_VER}/`;
    const [appM, authM, fsM] = await Promise.all([import(base + 'firebase-app.js'), import(base + 'firebase-auth.js'), import(base + 'firebase-firestore.js')]);
    const app = appM.initializeApp(FIREBASE_CONFIG);
    FB.A = authM; FB.F = fsM; FB.auth = authM.getAuth(app); FB.db = fsM.getFirestore(app);
    FB.ok = true;
    authM.onAuthStateChanged(FB.auth, onUser);
  }catch(e){ FB.ok = false; FB.err = e; }
  FB.loading = false;
  if(view === 'account') render();
}
function safeRender(){ if((view === 'battle' && B && !B.over) || view === 'pvpb' || view === 'pvp2b') return; render(); }
async function onUser(user){
  FB.user = user;
  if(user){
    const name = FB.pendingName || user.displayName || user.email.split('@')[0];
    if(CUR !== name){ CUR = name; lsSet(CUR_KEY, name); S = load() || newGame(); }
    try{
      const ref = FB.F.doc(FB.db, 'saves', user.uid), snap = await FB.F.getDoc(ref);
      if(snap.exists() && !FB.pendingStart){ const raw = JSON.parse(snap.data().data); S = fix(raw); lsSet(saveKey(), JSON.stringify(S)); if((raw.season||1) < SEASON) await cloudSave(true); }
      else { if(FB.pendingStart) S = fix(FB.pendingStart); lsSet(saveKey(), JSON.stringify(S)); await cloudSave(true); }
    }catch(e){ msg = 'Signed in, but the cloud save could not be reached. Playing with the copy on this device.'; }
    FB.pendingStart = null; FB.pendingName = null;
  } else if(CUR){
    CUR = null; lsDel(CUR_KEY); S = load() || newGame();
  }
  S.hp = MHP();
  safeRender();
}
let cloudT = null;
function cloudSave(now){
  if(!FB.ok || !FB.user) return Promise.resolve();
  clearTimeout(cloudT);
  const go = () => FB.F.setDoc(FB.F.doc(FB.db, 'saves', FB.user.uid), { name: CUR, data: JSON.stringify(S), updated: Date.now() }).catch(() => {});
  if(now) return go();
  cloudT = setTimeout(go, 1500); return Promise.resolve();
}
document.addEventListener('visibilitychange', () => { if(document.visibilityState === 'hidden') cloudSave(true); });
const fbMsg = e => {
  const c = (e && e.code) || '';
  if(c.includes('email-already-in-use')) return 'That username is already taken — try another one.';
  if(c.includes('weak-password')) return 'Password must be at least 6 characters.';
  if(c.includes('invalid-credential') || c.includes('wrong-password') || c.includes('user-not-found') || c.includes('invalid-email'))
    return 'Wrong username or password — tap 👁 to check what you typed.';
  if(c.includes('too-many-requests')) return 'Too many tries. Please wait a minute and try again.';
  if(c.includes('network')) return 'No internet connection — check your network and try again.';
  if(c.includes('operation-not-allowed')) return 'Online login is not switched on yet (Email/Password in Firebase).';
  if(c.includes('unauthorized-domain')) return 'This website is not allowed yet in Firebase (Authorized domains).';
  return 'Something went wrong (' + (c || 'unknown') + '). Please try again.';
};
