<!DOCTYPE html>
<html lang="en">

<meta property="og:image" content="https://sikosoof56.github.io/Starquest/og-cover.jpg">
<meta property="og:image:width" content="1200">

<link rel="manifest" href="manifest.webmanifest?v=2">
<link rel="icon" href="icon-192-v2.png">
<link rel="apple-touch-icon" href="apple-touch-icon-v2.png">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Nunito:wght@400;700;800;900&display=swap">
<style>
:root{--bg:#0d1d12;--card:#152b1b;--card2:#1c3824;--line:#2f5a37;--leaf:#8fd14f;--leaf2:#4caf50;--gold:#f2c94c;
  --ink:#eef6e6;--mute:#a9c4a0;--red:#e5533d;--blue:#3f8fd8}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{touch-action:manipulation;-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;font-family:Nunito,system-ui,sans-serif;color:var(--ink);overscroll-behavior:none;
  background:radial-gradient(ellipse at 50% -10%,#2c5a33 0%,#13281a 45%,var(--bg) 80%) fixed;
  -webkit-user-select:none;user-select:none;min-height:100vh}
#app{max-width:520px;margin:0 auto;padding:12px;padding-top:max(12px,env(safe-area-inset-top));padding-bottom:max(16px,env(safe-area-inset-bottom))}
h1{font-family:Cinzel,Georgia,serif;font-weight:900;font-size:24px;text-align:center;letter-spacing:2px;margin:4px 0 12px;
  color:var(--gold);text-shadow:0 2px 0 #5a3e0a,0 0 14px #f2c94c55;display:flex;align-items:center;justify-content:center;gap:8px}
h1 .crest .i{width:24px;height:24px;vertical-align:-3px}
h2{font-family:Cinzel,Georgia,serif;font-size:17px;margin:0 0 10px;color:#f4e7c0;display:flex;align-items:center;gap:6px}
.sub{font-size:12px;letter-spacing:1px;text-transform:uppercase;color:var(--leaf);margin:10px 0 2px;font-weight:800}
.card{background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:10px;
  box-shadow:0 4px 14px #0006,inset 0 1px 0 #ffffff10}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between}
.i{width:1.15em;height:1.15em;vertical-align:-.22em;flex-shrink:0}
.ii{width:30px;height:30px;flex-shrink:0;vertical-align:middle}
.bar{height:10px;background:#0b170e;border-radius:6px;overflow:hidden;margin:3px 0 6px;box-shadow:inset 0 1px 2px #000a}
.bar>i{display:block;height:100%;transition:width .35s;border-radius:6px}
.hp>i{background:linear-gradient(90deg,#d83a2c,#ff7b6b)}
.mp>i{background:linear-gradient(90deg,#2f7fd0,#7fd3ff)}
.ex>i{background:linear-gradient(90deg,#d9a520,#ffe27a)}
.qb>i{background:linear-gradient(90deg,#4caf50,#b8ff5a)}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
button{font:inherit;font-weight:700;font-size:15px;padding:12px;border-radius:12px;border:1px solid #3f7347;color:var(--ink);cursor:pointer;
  background:linear-gradient(180deg,#24472d,#1a3622);box-shadow:0 3px 0 #0b1a0f,inset 0 1px 0 #ffffff14;display:inline-flex;align-items:center;justify-content:center;gap:6px}
button:active{transform:translateY(2px);box-shadow:0 1px 0 #0b1a0f}
button:disabled{opacity:.42;cursor:default}
button.pri{background:linear-gradient(180deg,#8fd14f,#4f9a2c);border-color:#b8ff5a;color:#10230f;box-shadow:0 3px 0 #2c5a18}
button.warn{background:linear-gradient(180deg,#a8392b,#7a2418);border-color:#e5533d}
button.ok{background:linear-gradient(180deg,#f2c94c,#c99a1e);border-color:#ffe27a;color:#3a2a05;box-shadow:0 3px 0 #7a5a0a}
.full{width:100%;margin-top:8px}
.small{font-size:13px;color:var(--mute)}
.msg{color:var(--gold);font-size:14px;font-weight:700;margin:8px 0 0}
.gold{font-weight:800;color:var(--gold);white-space:nowrap;display:inline-flex;align-items:center;gap:4px}
.tag{display:inline-block;background:#8fd14f22;color:var(--leaf);border:1px solid #8fd14f66;border-radius:8px;padding:0 7px;font-size:12px;margin-left:6px;font-weight:800}
/* Hero card */
.hero{position:relative;overflow:hidden;background:linear-gradient(160deg,#2a5232,#152b1b 65%);border-color:#4b8a4f}
.hero::before{content:'';position:absolute;top:0;left:-60%;width:40%;height:100%;pointer-events:none;
  background:linear-gradient(100deg,transparent,#ffffff12,transparent);animation:shine 6s ease-in-out infinite}
.nm{font-family:Cinzel,Georgia,serif;font-size:17px}
.avatar{width:70px;height:70px;border-radius:18px;flex-shrink:0;overflow:hidden;
  background:radial-gradient(circle at 50% 35%,#cfeaa8,#5fa043 70%);border:2px solid var(--gold);box-shadow:0 0 0 3px #0b170e,0 4px 10px #0008}
.avatar .art{width:100%;height:100%;transform:translateY(6px) scale(1.15)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:8px 0}
.stat{background:#0b170e99;border:1px solid #2f5a37;border-radius:10px;padding:6px 4px;text-align:center}
.stat b{display:block;font-size:17px}
.stat span{font-size:11px;color:var(--mute);letter-spacing:.5px}
.mini{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mini button{padding:9px;font-size:13px}
.topbar{display:flex;gap:10px;align-items:center}
.mini-av{width:48px;height:48px;border-radius:12px;overflow:hidden;flex-shrink:0;background:radial-gradient(circle at 50% 35%,#cfeaa8,#5fa043 70%);border:2px solid var(--gold)}
.mini-av .art{width:100%;height:100%;transform:translateY(4px) scale(1.15)}
.topbar .bar{height:7px;margin:3px 0}
/* Menu tiles */
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{position:relative;aspect-ratio:1/1;flex-direction:column;gap:4px;padding:6px;font-size:13px;line-height:1.25;text-align:center;border-radius:16px;
  background:linear-gradient(180deg,#24472d,#16301d);border:1px solid #3f7347}
.tile .ic{display:block;width:46px;height:46px;transition:transform .2s;filter:drop-shadow(0 3px 2px #0008)}
.tile .ic svg{width:100%;height:100%}
.tile:active .ic{transform:scale(1.15) rotate(-6deg)}
.tile-av{display:block;width:46px;height:46px;border-radius:50%;overflow:hidden;border:2px solid var(--gold);background:#5fa043}
.tile-av .art{width:100%;height:100%;transform:translateY(4px) scale(1.2)}
.badge{position:absolute;top:6px;right:6px;background:var(--red);color:#fff;border-radius:10px;font-size:11px;padding:1px 6px;font-weight:800}
.badge.soon{background:#0b170e;color:var(--mute);border:1px solid #2f5a37}
/* Lists */
.item{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid #2f5a3766}
.item:last-child{border:0}
.item button{padding:8px 12px;font-size:14px;white-space:nowrap}
.it{display:flex;align-items:center;gap:10px}
.slots{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:6px}
.slot{display:flex;gap:8px;align-items:center;background:#0b170e88;border:1px dashed #3f7347;border-radius:12px;padding:8px;font-size:13px;font-weight:700}
.slot>.i{width:30px;height:30px;color:var(--mute)}
.story{font-size:14px;line-height:1.7;color:#e0eed6;background:#0b170e99;border-left:3px solid var(--leaf);border-radius:10px;padding:10px 12px;margin:10px 0}
.map{width:100%;height:auto;display:block;border-radius:14px;box-shadow:inset 0 0 0 2px #0b170e,0 4px 10px #0007}
.map .ping{animation:ping 1.4s ease-out infinite;transform-box:fill-box;transform-origin:center}
.chars{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ch{border:1px solid #3f7347;border-radius:14px;padding:8px 4px;text-align:center;font-size:12px;background:#0b170e88}
.ch .e{width:64px;height:64px;margin:0 auto;border-radius:50%;overflow:hidden;background:radial-gradient(circle at 50% 35%,#cfeaa8,#5fa043 70%)}
.ch .e .art{width:100%;height:100%;transform:translateY(5px) scale(1.15)}
.ch .e.lk{display:flex;align-items:center;justify-content:center;background:#0b170e}
.ch .e.lk .i{width:28px;height:28px;color:var(--mute)}
.ch.sel{border-color:var(--gold);box-shadow:0 0 10px #f2c94c55}
.ch.lock{opacity:.5}
.pvp-art{display:flex;align-items:center;justify-content:center;gap:4px}
.pvp-art .art{width:110px;height:110px}
.pvp-art .art:last-child{transform:scaleX(-1)}
.vs{font-family:Cinzel,serif;font-weight:900;font-size:28px;color:var(--gold);text-shadow:0 2px 0 #5a3e0a}
textarea{width:100%;height:70px;background:#0b170e;color:var(--leaf);border:1px solid #3f7347;border-radius:10px;font-size:16px;padding:8px;-webkit-user-select:text;user-select:text}
.lbl{display:block;font-size:13px;color:var(--mute);margin:10px 0 4px;font-weight:700}
input:not([type=checkbox]){width:100%;font:inherit;font-size:16px;padding:12px;border-radius:12px;border:1px solid #3f7347;background:#0b170e;color:var(--ink);
  -webkit-user-select:text;user-select:text;outline:none}
input:focus{border-color:var(--leaf);box-shadow:0 0 0 3px #8fd14f33}
.check{display:flex;gap:8px;align-items:center;font-size:14px;margin:12px 0 2px}
.check input{width:20px;height:20px;accent-color:#8fd14f}
/* ===== Battle scene ===== */
#log{height:104px;overflow-y:auto;font-size:14px;line-height:1.6}
#log div:last-child{color:#fff;font-weight:700}
.scene{position:relative;height:300px;border-radius:18px;overflow:hidden;margin-bottom:10px;border:2px solid #4b8a4f;box-shadow:0 6px 18px #000a}
.scene .bg{position:absolute;inset:0;width:100%;height:100%}
.ent{position:absolute;z-index:2}
.ent .art{width:100%;height:100%;overflow:visible;display:block}
.en{right:6%;top:64px;width:124px;height:124px;animation:inR .7s cubic-bezier(.2,.9,.3,1.2) backwards}
.en.flyer{top:40px}
.en.boss{right:3%;top:38px;width:160px;height:160px}
.pl{left:6%;bottom:30px;width:112px;height:112px;animation:inL .7s cubic-bezier(.2,.9,.3,1.2) .15s backwards}
.shadow{position:absolute;z-index:1;border-radius:50%;background:radial-gradient(#0008,transparent 70%)}
.se{right:calc(6% + 12px);top:176px;width:100px;height:22px}
.se.fly{width:70px;right:calc(6% + 27px);opacity:.6}
.se.big{right:calc(3% + 16px);top:186px;width:128px;height:26px}
.sp{left:calc(6% + 12px);bottom:24px;width:90px;height:18px}
.ent.guard::after{content:'';position:absolute;inset:-6px;border-radius:50%;border:3px solid #b8ff5a;
  box-shadow:0 0 18px #8fd14f,inset 0 0 18px #8fd14f66;animation:pulse 1s ease-in-out infinite;pointer-events:none}
.plate{position:absolute;z-index:3;width:48%;background:#0d1d12e0;border:1px solid #4b8a4f;border-radius:12px;padding:6px 8px;font-size:12px;box-shadow:0 3px 8px #0008}
.plate b{font-size:12px}
.plate .bar{height:7px;margin:3px 0}
.plate.e{left:8px;top:8px}.plate.p{right:8px;bottom:8px}
.ff{position:absolute;z-index:1;width:5px;height:5px;border-radius:50%;background:#fffbb0;box-shadow:0 0 8px 3px #fff59d99;animation:ff 6s ease-in-out infinite;pointer-events:none}
.lf{position:absolute;z-index:1;top:-12px;width:10px;height:10px;background:#9ccc65;border-radius:0 100% 0 100%;animation:fall 9s linear infinite;pointer-events:none;opacity:.85}
.ft{position:absolute;z-index:6;pointer-events:none;white-space:nowrap;font-family:Nunito,sans-serif;font-weight:900;font-size:26px;color:#fff;
  -webkit-text-stroke:1px #2a0f0a;text-shadow:0 3px 0 #2a0f0a,0 0 10px #ff5a4a}
.ft.crit{font-size:32px;color:#ffd54a;text-shadow:0 3px 0 #4a2a00,0 0 12px #ff9800}
.ft.heal{color:#c6ff7a;-webkit-text-stroke:1px #0f2a0f;text-shadow:0 3px 0 #0f2a0f,0 0 10px #4caf50}
.ft.mp{color:#9be3ff;-webkit-text-stroke:1px #0a1f33;text-shadow:0 3px 0 #0a1f33,0 0 10px #3f8fd8}
.ft.big{font-family:Cinzel,serif;font-size:30px;color:#ffd54a;text-shadow:0 3px 0 #4a2a00,0 0 16px #ffd54a}
.pt{position:absolute;z-index:5;pointer-events:none;transform:translate(-50%,-50%)}
.pt.spark{width:9px;height:9px;border-radius:50%;background:var(--c,#fff);box-shadow:0 0 10px 3px var(--c,#fff)}
.pt.leaf{width:12px;height:12px;background:#8fd14f;border-radius:0 100% 0 100%;box-shadow:0 0 6px #b8ff5a}
.pt.coin{width:14px;height:14px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff2b0,#f2c94c 50%,#b8861b);border:1px solid #8a6312}
.pt.fire{width:14px;height:14px;border-radius:50%;background:radial-gradient(#fff3b0,#ff9800 50%,#e5533d);box-shadow:0 0 12px 4px #ff9800aa}
.pt.plus{font-weight:900;font-size:22px;color:var(--c,#b8ff5a);text-shadow:0 0 8px var(--c,#b8ff5a),0 2px 0 #0008}
.pt.star{width:14px;height:14px;background:#ffd54a;clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);filter:drop-shadow(0 0 6px #ffd54a)}
.pt.big .ii{width:38px;height:38px}
.slash{position:absolute;z-index:5;pointer-events:none;filter:drop-shadow(0 0 8px #fff)}
/* ===== Character idle / attack animation ===== */
.art .bod,.art .arm,.art .wingL,.art .wingR,.art .tail,.art .crown{transform-box:view-box}
.art .bod{transform-origin:60px 110px;animation:breathe 2.6s ease-in-out infinite}
.art .eyes{transform-box:fill-box;transform-origin:center;animation:blink 4.2s infinite}
.art.hero-art .arm{transform-origin:76px 66px;animation:sway-arm 2.6s ease-in-out infinite}
.hero-art .tail{transform-origin:40px 38px;animation:flutter 1.2s ease-in-out infinite}
.art .squish{animation:squish 1.3s ease-in-out infinite}
.art .hop{animation:hop 1.6s ease-in-out infinite}
.art .fly{transform-origin:60px 62px;animation:hover 1.8s ease-in-out infinite}
.art .wingL{transform-origin:48px 64px;animation:flapL .35s ease-in-out infinite alternate}
.art .wingR{transform-origin:72px 64px;animation:flapR .35s ease-in-out infinite alternate}
.big .wingL{animation-duration:.9s}.big .wingR{animation-duration:.9s}
.art .sway{animation:treesway 3.2s ease-in-out infinite}
.art .crown{transform-origin:60px 40px;animation:treesway 3.2s ease-in-out infinite reverse}
.art .arm{transform-origin:44px 68px}
.big .tail{transform-origin:80px 92px;animation:wag 1.6s ease-in-out infinite}
.atk .art.hero-art .arm{animation:hslash .44s ease-in-out}
.atk .art:not(.hero-art) .arm{animation:club .5s ease-in-out}
.atk .art .squish{animation:jump .44s ease-in-out}
.atk .art .eyes{animation:none;transform:scaleY(.6)}
.hurt .art .eyes{animation:none;transform:scaleY(.15)}
@keyframes breathe{50%{transform:scale(1.025,.975)}}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes sway-arm{50%{transform:rotate(-4deg)}}
@keyframes flutter{50%{transform:rotate(12deg)}}
@keyframes hslash{0%{transform:rotate(0)}35%{transform:rotate(-55deg)}70%{transform:rotate(70deg)}100%{transform:rotate(0)}}
@keyframes club{0%{transform:rotate(0)}40%{transform:rotate(35deg)}75%{transform:rotate(-60deg)}100%{transform:rotate(0)}}
@keyframes squish{0%,100%{transform:scale(1,1)}50%{transform:scale(1.08,.9)}}
@keyframes jump{0%{transform:scale(1)}30%{transform:scale(1.15,.8)}60%{transform:scale(.9,1.15) translateY(-14px)}100%{transform:scale(1)}}
@keyframes hop{0%,100%{transform:translateY(0)}40%{transform:translateY(-6px) rotate(-3deg)}60%{transform:translateY(-6px) rotate(3deg)}}
@keyframes hover{50%{transform:translateY(-9px)}}
@keyframes flapL{from{transform:rotate(18deg) scaleY(.85)}to{transform:rotate(-14deg)}}
@keyframes flapR{from{transform:rotate(-18deg) scaleY(.85)}to{transform:rotate(14deg)}}
@keyframes treesway{50%{transform:rotate(1.5deg)}}
@keyframes wag{50%{transform:rotate(-10deg)}}
@keyframes pulse{50%{transform:scale(1.06);opacity:.7}}
@keyframes ping{0%{transform:scale(.8);opacity:.6}100%{transform:scale(1.6);opacity:0}}
@keyframes inR{from{transform:translateX(170px);opacity:0}}
@keyframes inL{from{transform:translateX(-170px);opacity:0}}
@keyframes ff{0%,100%{transform:translate(0,0);opacity:.2}50%{transform:translate(14px,-18px);opacity:1}}
@keyframes fall{0%{transform:translate(0,0) rotate(0)}100%{transform:translate(-60px,330px) rotate(540deg)}}
/* Page animation */
.page{animation:fadeUp .35s ease-out}
.page .tile{animation:pop .45s cubic-bezier(.2,.9,.3,1.3) backwards}
.page .tile:nth-child(2){animation-delay:.05s}.page .tile:nth-child(3){animation-delay:.1s}
.page .tile:nth-child(4){animation-delay:.15s}.page .tile:nth-child(5){animation-delay:.2s}.page .tile:nth-child(6){animation-delay:.25s}
@keyframes shine{0%,60%{left:-60%}100%{left:130%}}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}}
@keyframes pop{from{opacity:0;transform:scale(.6)}}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
small.mpc{font-size:11px;background:#2f7fd0;color:#fff;border-radius:6px;padding:1px 5px;font-weight:800}
small.mpc::after{content:' MP'}
#ctrl button{font-size:14px;white-space:nowrap;padding:12px 6px}
.valc-art .crest{transform-box:fill-box;transform-origin:50% 100%;animation:flutter 1.8s ease-in-out infinite}
/* ===== Character card (home) ===== */
.cc{display:grid;grid-template-columns:42% 1fr;gap:12px;position:relative;overflow:hidden;
  background:linear-gradient(160deg,#2a5232,#152b1b 65%);border-color:#4b8a4f}
.cc::before{content:'';position:absolute;top:0;left:-60%;width:40%;height:100%;pointer-events:none;
  background:linear-gradient(100deg,transparent,#ffffff10,transparent);animation:shine 6s ease-in-out infinite}
.cc-name{font-family:Cinzel,Georgia,serif;font-weight:900;font-size:18px;color:#f4e7c0;text-align:center;margin-bottom:6px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.portrait{position:relative;display:block;width:100%;aspect-ratio:3/4;padding:0;border-radius:16px;overflow:hidden;
  background:radial-gradient(ellipse at 50% 30%,#d6f0b0,#6fb04f 55%,#2f6b34);border:2px solid var(--gold);
  box-shadow:0 0 0 3px #0b170e,0 6px 14px #0009}
.portrait::after{content:'';position:absolute;left:15%;right:15%;bottom:7%;height:8%;border-radius:50%;background:radial-gradient(#0007,transparent 70%)}
.portrait .art{position:absolute;inset:4% -6% 0;width:112%;height:96%;z-index:1}
.portrait .swap{position:absolute;z-index:2;left:50%;bottom:6px;transform:translateX(-50%);font-size:11px;font-weight:800;
  background:#0d1d12cc;border:1px solid #4b8a4f;color:var(--mute);border-radius:8px;padding:1px 8px}
.cc-stats{margin-top:8px;display:grid;gap:3px}
.cc-stats div{display:flex;justify-content:space-between;align-items:center;background:#0b170e99;border:1px solid #2f5a37;border-radius:8px;padding:3px 8px}
.cc-stats span{font-size:11px;letter-spacing:.8px;color:var(--mute);font-weight:800}
.cc-stats b{font-size:15px}
.cc-r{display:flex;flex-direction:column;min-width:0}
.tag.big{font-size:14px;padding:2px 10px;margin:0}
.xp{margin:6px 0 2px}.xp .bar{height:6px;margin:0}.xp span{font-size:10px;color:var(--mute)}
.sec{font-size:11px;letter-spacing:1.2px;text-transform:uppercase;color:var(--leaf);font-weight:900;margin:8px 0 4px}
.s4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.sl{position:relative;aspect-ratio:1/1;padding:0;border-radius:12px;flex-direction:column;gap:0;
  background:radial-gradient(circle at 50% 35%,#2f5a37,#122617);border:1px solid #4b8a4f;box-shadow:0 2px 0 #0b1a0f,inset 0 1px 0 #ffffff14}
.sl .ii{width:62%;height:62%}

// ---- Forest battle background ----
function pine(x, base, h, c){
  const w = h*.42;
  return `<path d="M${x} ${base-h} L${x+w*.55} ${base-h*.55} L${x+w*.3} ${base-h*.55} L${x+w*.75} ${base-h*.22} L${x+w*.4} ${base-h*.22} L${x+w} ${base} L${x-w} ${base} L${x-w*.4} ${base-h*.22} L${x-w*.75} ${base-h*.22} L${x-w*.3} ${base-h*.55} L${x-w*.55} ${base-h*.55}Z" fill="${c}"/>`;
}
function forestBG(){
  let far = '', mid = '', near = '';
  for(let i=0;i<14;i++) far  += pine(i*31 - 6 + (i%3)*5, 165, 70 + (i*37)%30, '#4c8f57');
  for(let i=0;i<10;i++) mid  += pine(i*45 + 10 + (i%2)*12, 178, 95 + (i*53)%35, '#2f6b3b');
  near += pine(-10,250,190,'#1a4526') + pine(410,250,200,'#1a4526') + pine(30,240,140,'#1f5530') + pine(372,236,130,'#1f5530');
  return `<svg class="bg" viewBox="0 0 400 300" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
    <defs>
      <linearGradient id="fSky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d7f0b8"/><stop offset=".45" stop-color="#8cc77a"/><stop offset="1" stop-color="#3d7b45"/></linearGradient>
      <linearGradient id="fGr" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5fa043"/><stop offset="1" stop-color="#2b5a24"/></linearGradient>
      <radialGradient id="fSun" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fffbe0" stop-opacity=".95"/><stop offset="1" stop-color="#fffbe0" stop-opacity="0"/></radialGradient>
    </defs>
    <rect width="400" height="300" fill="url(#fSky)"/>
    <circle cx="300" cy="48" r="90" fill="url(#fSun)"/>
    <g opacity=".7">${far}</g>

// ====== SOUND EFFECTS (made with Web Audio — no sound files needed) ======
const SFX = (() => {
  let ctx = null, on = lsGet('sq_sound') !== 'off';
  const ac = () => {
    if(!ctx){ try{ ctx = new (window.AudioContext || window.webkitAudioContext)(); }catch(e){ return null; } }
    if(ctx.state === 'suspended') ctx.resume();
    return ctx;
  };
  function tone(f, dur, type='square', vol=.12, slide=1, delay=0){
    const c = ctx, t = c.currentTime + delay, o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t);
    if(slide !== 1) o.frequency.exponentialRampToValueAtTime(Math.max(30, f*slide), t + dur);
    g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + .01); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    o.connect(g).connect(c.destination); o.start(t); o.stop(t + dur + .02);
  }
  function noise(dur, vol=.2, freq=1200, ftype='lowpass', delay=0, sweep=1){
    const c = ctx, t = c.currentTime + delay, n = Math.floor(c.sampleRate*dur), buf = c.createBuffer(1, n, c.sampleRate), d = buf.getChannelData(0);
    for(let i=0;i<n;i++) d[i] = Math.random()*2 - 1;
    const s = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
    s.buffer = buf; f.type = ftype; f.frequency.setValueAtTime(freq, t);
    if(sweep !== 1) f.frequency.exponentialRampToValueAtTime(Math.max(40, freq*sweep), t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    s.connect(f).connect(g).connect(c.destination); s.start(t); s.stop(t + dur);
  }
  const arp = (notes, step=.09, type='triangle', vol=.12, len=.18) => notes.forEach((f,i) => tone(f, len, type, vol, 1, i*step));
  const P = {
    click:   () => tone(720, .045, 'square', .04),
    swing:   () => noise(.16, .22, 2500, 'bandpass', 0, .35),
    swingBig:() => { noise(.26, .3, 3000, 'bandpass', 0, .25); tone(220, .2, 'sawtooth', .04, .5); },
    hit:     () => { noise(.1, .35, 900); tone(160, .1, 'square', .1, .5); },
    crit:    () => { noise(.16, .45, 1400); tone(240, .16, 'sawtooth', .14, .4); tone(1200, .12, 'square', .05, .6, .03); },
    hurt:    () => { noise(.12, .3, 700); tone(110, .14, 'square', .1, .6); },
    charge:  () => tone(300, .45, 'sawtooth', .05, 3),
    stab:    () => { noise(.08, .3, 4000, 'highpass'); tone(1400, .08, 'square', .05, .5); },
    boom:    () => { noise(.6, .6, 500, 'lowpass', 0, .15); tone(80, .5, 'sine', .35, .4); },
    heal:    () => arp([523, 659, 784, 1047], .08, 'sine', .1, .3),
    guard:   () => { tone(880, .25, 'triangle', .1, .98); tone(1320, .2, 'sine', .06, 1, .02); noise(.05, .2, 5000, 'highpass'); },
    potion:  () => { [0,.07,.14].forEach(d => tone(400 + Math.random()*300, .08, 'sine', .1, 1.8, d)); },
    power:   () => { tone(200, .35, 'sawtooth', .07, 4); arp([392, 523, 659], .1, 'square', .05, .15); },
    throw:   () => noise(.3, .15, 1800, 'bandpass', 0, .4),
    poof:    () => { noise(.35, .3, 1600, 'lowpass', 0, .2); tone(500, .25, 'triangle', .08, .3); },
    coin:    () => { tone(988, .08, 'square', .07); tone(1319, .25, 'square', .07, 1, .07); },
    upgrade: () => { tone(220, .08, 'square', .1); noise(.06, .3, 6000, 'highpass', .02); arp([784, 988, 1175, 1568], .07, 'triangle', .08, .2); },
    win:     () => arp([523, 659, 784, 1047, 784, 1047], .11, 'square', .07, .22),
    lose:    () => arp([392, 349, 311, 262], .2, 'triangle', .1, .35),
    levelup: () => arp([523, 659, 784, 1047, 1319, 1568], .07, 'square', .06, .2),
    run:     () => [0,.08,.16].forEach(d => noise(.06, .15, 1500, 'bandpass', d)),
    start:   () => { tone(65, .9, 'sawtooth', .12, .7); noise(.8, .25, 400, 'lowpass', 0, .3); arp([262, 392, 523, 784], .12, 'triangle', .08, .4); },
    miss:    () => noise(.2, .12, 3000, 'bandpass', 0, .3)
  };
  return {
    play(n){ if(!on || !ac()) return; try{ P[n] && P[n](); }catch(e){} },
    toggle(){ on = !on; lsSet('sq_sound', on ? 'on' : 'off'); if(on){ ac(); P.coin(); } return on; },
    get on(){ return on; }
  };
})();

// ====== State & saving ======
function newGame(){
  return {char:'pilot',lv:1,exp:0,hp:80,gold:30,stage:1,best:1,
          inv:{potion:3,power:1,iron:0,bomb:1},arts:['potion','power'],bag:[],nid:1,eq:[],powder:0,ss:1,chars:['pilot'],
          st:{wins:0,bosses:0,lasers:0,buys:0},qt:{}};
}
function fix(o){
  const s = Object.assign(newGame(), o);
  if(!o.st) s.st = {wins:o.wins||0, bosses:Math.floor(((o.stage||1)-1)/5), lasers:0, buys:0};
  if(!Array.isArray(s.chars)) s.chars = ['pilot'];
  if(!s.chars.includes('pilot')) s.chars.unshift('pilot');
  if(!CHARS[s.char] || !s.chars.includes(s.char)) s.char = 'pilot';
  // older saves: mana potions become power potions, armor is gone, weapons only
  s.inv = Object.assign({potion:0,power:0,iron:0,bomb:0}, s.inv);
  if(s.inv.ether){ s.inv.power += s.inv.ether; delete s.inv.ether; }
  // old weapons/armor are refunded as gold
  (s.gear||[]).forEach(k => { if(!GEAR[k] && OLD_PRICES[k]) s.gold += OLD_PRICES[k]; });
  // items are now individual copies in a bag: {i:id, k:itemKey, up:upgrade, fu:fusion}
  if(!Array.isArray(o.bag)){
    s.bag = []; s.nid = 1;
    const oldUp = s.up || {}, oldEq = s.eq || [];
    (s.gear||[]).filter(k => GEAR[k]).forEach(k => s.bag.push({ i:s.nid++, k, up:Math.min(MAX_UP, oldUp[k]||0), fu:0 }));
    s.eq = oldEq.map(k => (s.bag.find(b => b.k === k) || {}).i).filter(Boolean);
  }
  s.bag = s.bag.filter(b => GEAR[b.k]);
  s.eq = (s.eq||[]).filter(id => s.bag.some(b => b.i === id)).slice(0,4);
  s.nid = Math.max(s.nid||1, ...s.bag.map(b => b.i + 1), 1);
  delete s.gear; delete s.up;
  delete s.w; delete s.mhp; delete s.batk; delete s.bdef;
  if(!Array.isArray(s.arts) || s.arts.length !== 2) s.arts = ['potion','power'];
  s.arts = s.arts.map(k => ITEMS[k] ? k : 'potion');
  delete s.mp; delete s.mmp; delete s.a;
  return s;
}

// an item's stats at its upgrade level (+30% of base per level)
// stats of one item copy: base × (1 + 10% per upgrade) × (1 + 25% per fusion star)  →  max +10 ★4 = ×4
const gearStats = (it, up = it.up, fu = it.fu) => { const o = {}; for(const st in GEAR[it.k].s){ const v = GEAR[it.k].s[st]; o[st] = Math.round(v * (1 + .1*up) * (1 + .25*fu)); } return o; };
const inst = id => S.bag.find(b => b.i === id);
const stars = n => n ? `<span class="stars">${'★'.repeat(n)}</span>` : '';
const itemName = it => `${GEAR[it.k].n} +${it.up}${stars(it.fu)}`;
const fuseMat = it => S.bag.filter(b => b.k === it.k && b.i !== it.i && !S.eq.includes(b.i)).sort((a,b) => (a.up+a.fu*20) - (b.up+b.fu*20))[0];
const canFuse = it => it.fu < MAX_FU && !!fuseMat(it);
const statTxt = o => Object.entries(o).map(([k,v]) => `${STATN[k]} +${v}${(k==='crit'||k==='def')?'%':''}`).join(' · ');
const itemStat = st => S.eq.reduce((t,id) => { const it = inst(id); return t + (it ? (gearStats(it)[st]||0) : 0); }, 0);
const upCost  = it => Math.round(GEAR[it.k].p * .3 * (it.up + 1));                    // gold (same as before)
const upPowder = it => Math.ceil(4 * (it.up + 1) * RAR_MULT[GEAR[it.k].r]);           // magic powder (same as before)
// selling gives back 50% of everything paid for that copy: price (+ copies fused into it) + gold spent upgrading
const SELL_RATE = .5;
const sellValue = it => Math.floor(SELL_RATE * (GEAR[it.k].p * (1 + it.fu) + GEAR[it.k].p * .3 * it.up * (it.up + 1) / 2));
const potionSell = k => Math.floor(ITEMS[k].p * SELL_RATE);
let sellArm = null;
const canUp = it => it.up < MAX_UP && S.gold >= upCost(it) && S.powder >= upPowder(it);

const crit = () => Math.min(100, 20 + itemStat('crit'));

const MODE_LV = { pvp:10 };             // level needed to open a mode

const dmgCalc = (a,d,m=1) => Math.max(1, Math.round((a*rnd(.85,1.15) - d*.6) * m));
const ch = () => CHARS[S.char];
const chapIdx = st => Math.floor((st-1)/5);

  if(view === 'cover'){ $('app').innerHTML = cover() + soundBtn('cv') + exitBtn('cv'); return; }
  if(view === 'bye'){ $('app').innerHTML = bye(); return; }
  let h = '';
  if(view==='home') h += heroCard() + menu();
  else if(view==='battle') h += battle();
  else {
    h += topBar();
    if(view==='quest') h += quest();
    else if(view==='story') h += story();
    else if(view==='modes') h += modes();
    else if(view==='steel') h += steel();
    else if(view==='shop') h += shop();
    else if(view==='pvp') h += pvp();
    else if(view==='set') h += setView();
    else if(view==='save') h += saveView();

const NODES = [[34,128],[100,78],[170,118],[240,66],[306,104]];
function storyMap(pos){
  let path = `M${NODES[0][0]} ${NODES[0][1]}`;
  for(let i=1;i<NODES.length;i++){
    const [x0,y0] = NODES[i-1], [x1,y1] = NODES[i];
    path += ` Q${(x0+x1)/2} ${i%2 ? y1-34 : y1+34} ${x1} ${y1}`;
  }
  const trees = [[14,60,26],[60,40,30],[140,40,24],[205,30,28],[290,30,26],[330,150,24],[130,160,22],[60,170,20],[270,160,26],[200,170,18],[344,50,22]]
    .map(([x,y,h]) => pine(x, y+h*.5, h, '#2e6b3a')).join('');
  const nodes = NODES.map(([x,y],i) => {
    const boss = i===4, done = i < pos, cur = i === pos;
    const r = boss ? 17 : 13;
    return `<g class="node ${cur?'cur':''}" transform="translate(${x} ${y})">
      ${cur ? `<circle r="${r+8}" fill="#f2c94c" opacity=".35" class="ping"/>` : ''}

      ${done ? '<path d="M-6 0l4 4 8-8" stroke="#14291a" stroke-width="3.4" fill="none" stroke-linecap="round"/>'
        : boss ? '<path d="M-9 4L-9-6L-4-1L0-9L4-1L9-6L9 4Z" fill="#f2c94c" stroke="#14291a" stroke-width="1.5"/>'
        : `<text y="5" text-anchor="middle" font-size="14" font-weight="800" fill="${cur?'#14291a':'#a9c4a0'}">${i+1}</text>`}
    </g>`;
  }).join('');
  return `<svg class="map" viewBox="0 0 340 180">
    <defs><linearGradient id="mapG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4f9a46"/><stop offset="1" stop-color="#2f6b34"/></linearGradient></defs>
    <rect width="340" height="180" rx="14" fill="url(#mapG)"/>
    <path d="M250 0 Q238 60 280 90 Q320 120 300 180" stroke="#5aa9c9" stroke-width="10" fill="none" opacity=".55"/>
    ${trees}
    <path d="${path}" stroke="#3a2416" stroke-width="9" fill="none" stroke-linecap="round" opacity=".35"/>
    <path d="${path}" stroke="#e7cf98" stroke-width="5" fill="none" stroke-dasharray="2 8" stroke-linecap="round"/>
    ${nodes}
  </svg>`;
}

function pickChar(k){ if(!CHARS[k]) return;
  if(!S.chars.includes(k)){ msg = `${CHARS[k].n} costs ${CHARS[k].price} gold — tap the price to buy.`; render(); return; }
  S.char = k; S.hp = MHP(); msg = `${CHARS[k].n} is ready for battle!`; save(); render(); }
function buyChar(k){
  const c = CHARS[k]; if(!c || S.chars.includes(k)) return;
  if(S.gold < c.price){ msg = `Not enough gold — ${c.n} costs ${c.price} gold.`; render(); return; }
  S.gold -= c.price; S.chars.push(k); SFX.play('levelup'); S.char = k; S.hp = MHP();
  msg = `You recruited ${c.n}! Now in your party.`; save(); render();
}
function equip(id){ const it = inst(id); if(!it || S.eq.includes(id) || S.eq.length >= 4) return;
  S.eq.push(id); msg = `Equipped ${itemName(it)}`; save(); render(); }
function unequip(id){ const it = inst(id); S.eq = S.eq.filter(x => x !== id); msg = it ? `Took off ${itemName(it)}` : ''; save(); render(); }
function sell(id){
  const it = inst(id); if(!it || S.eq.includes(id)) return;
  if(sellArm !== id){ sellArm = id; msg = `Tap <b>Sure?</b> to sell ${itemName(it)} for ${sellValue(it)} gold.`; render(); return; }
  sellArm = null;
  const v = sellValue(it); S.bag = S.bag.filter(b => b !== it); S.gold += v; SFX.play('coin');
  msg = `Sold ${itemName(it)} for ${v} gold.`; save(); render();
}
function sellPotion(k){
  if(!S.inv[k]) return;
  const v = potionSell(k); S.inv[k]--; S.gold += v; SFX.play('coin');
  msg = `Sold a ${ITEMS[k].n} for ${v} gold.`; save(); render();
}
function fuse(id){
  const it = inst(id); if(!it || !canFuse(it)) return;
  const m = fuseMat(it); S.bag = S.bag.filter(b => b !== m); it.fu++;
  SFX.play('levelup'); msg = `Fused! ${itemName(it)} — ${statTxt(gearStats(it))}`; save(); render();
}
function equipArt(k){
  if(S.arts.includes(k)) return;
  S.arts = [S.arts[1], k];          // newest replaces the oldest slot
  msg = `${ITEMS[k].n} added to your artifacts`; save(); render();
}
function upgrade(id){
  const it = inst(id); if(!it || !canUp(it)) return;
  S.gold -= upCost(it); S.powder -= upPowder(it); it.up++; SFX.play('upgrade');
  msg = `${GEAR[it.k].n} upgraded to +${it.up}!`; save(); render();
}

// ---- Online accounts (Firebase Auth + Firestore) ----
const FB = { ok:false, loading:true, user:null, pendingName:null, pendingStart:null };
async function fbInit(){
  try{
    const base = `https://www.gstatic.com/firebasejs/${FB_VER}/`;
    const [appM, authM, fsM] = await Promise.all([import(base + 'firebase-app.js'), import(base + 'firebase-auth.js'), import(base + 'firebase-firestore.js')]);
    const app = appM.initializeApp(FIREBASE_CONFIG);
    FB.A = authM; FB.F = fsM; FB.auth = authM.getAuth(app); FB.db = fsM.getFirestore(app);
    FB.ok = true;
    authM.onAuthStateChanged(FB.auth, onUser);
  }catch(e){ FB.ok = false; FB.err = e; }
  FB.loading = false;
  if(view === 'account') render();
}
function safeRender(){ if(view === 'battle' && B && !B.over) return; render(); }
async function onUser(user){
  FB.user = user;
  if(user){
    const name = FB.pendingName || user.displayName || user.email.split('@')[0];
    if(CUR !== name){ CUR = name; lsSet(CUR_KEY, name); S = load() || newGame(); }
    try{
      const ref = FB.F.doc(FB.db, 'saves', user.uid), snap = await FB.F.getDoc(ref);
      if(snap.exists() && !FB.pendingStart){ S = fix(JSON.parse(snap.data().data)); lsSet(saveKey(), JSON.stringify(S)); }
      else { if(FB.pendingStart) S = fix(FB.pendingStart); lsSet(saveKey(), JSON.stringify(S)); await cloudSave(true); }
    }catch(e){ msg = 'Signed in, but the cloud save could not be reached. Playing with the copy on this device.'; }
    FB.pendingStart = null; FB.pendingName = null;
  } else if(CUR){
    CUR = null; lsDel(CUR_KEY); S = load() || newGame();
  }
  S.hp = MHP();
  safeRender();
}
let cloudT = null;
function cloudSave(now){
  if(!FB.ok || !FB.user) return Promise.resolve();
  clearTimeout(cloudT);
  const go = () => FB.F.setDoc(FB.F.doc(FB.db, 'saves', FB.user.uid), { name: CUR, data: JSON.stringify(S), updated: Date.now() }).catch(() => {});
  if(now) return go();
  cloudT = setTimeout(go, 1500); return Promise.resolve();
}
document.addEventListener('visibilitychange', () => { if(document.visibilityState === 'hidden') cloudSave(true); });
const fbMsg = e => {
  const c = (e && e.code) || '';
  if(c.includes('email-already-in-use')) return 'That username is already taken — try another one.';
  if(c.includes('weak-password')) return 'Password must be at least 6 characters.';
  if(c.includes('invalid-credential') || c.includes('wrong-password') || c.includes('user-not-found') || c.includes('invalid-email'))
    return 'Wrong username or password — tap 👁 to check what you typed.';
  if(c.includes('too-many-requests')) return 'Too many tries. Please wait a minute and try again.';
  if(c.includes('network')) return 'No internet connection — check your network and try again.';
  if(c.includes('operation-not-allowed')) return 'Online login is not switched on yet (Email/Password in Firebase).';
  if(c.includes('unauthorized-domain')) return 'This website is not allowed yet in Firebase (Authorized domains).';
  return 'Something went wrong (' + (c || 'unknown') + '). Please try again.';
};

// ====== TURN-BASED BATTLE (animated) ======
const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
const wait = ms => new Promise(r => setTimeout(r, RM ? 0 : ms));
const an = (el, kf, opt) => el ? el.animate(kf, RM ? {...opt, duration:1} : opt).finished : Promise.resolve();
const pct = (v,m) => Math.max(0, Math.min(100, v/m*100)) + '%';

function makeEnemy(mode, st){
  const boss = st % 5 === 0, steelM = mode === 'steel';
  const list = steelM ? STEEL_ENEMIES : ENEMIES, bl = steelM ? STEEL_BOSSES : BOSSES;
  const base = boss ? bl[(st/5 - 1) % bl.length] : list[Math.floor(Math.random()*list.length)];
  const EASE = .8 * 1.25;   // monster HP and ATK (was 20% weaker, now +25% from that)
  const hp = Math.round((steelM ? 55 + st*13 : 45 + st*11) * (boss ? 1.8 : 1) * EASE);
  return { n:base.n, art:base.art, fly:!!base.fly, tint:base.tint||'', hp, mhp:hp, boss, dp: boss ? .2 : .1,   // DEF %: normal 10%, boss 20%
    spd: base.spd + Math.floor(st*.5),
    atk: Math.round((7 + st*2) * (boss ? 1.15 : 1) * EASE),
    def: Math.round((2 + st*1) * (boss ? 1.2 : 1)),
    gold: earn((10 + st*6) * (boss ? 2 : 1)),
    exp:  Math.round((10 + st*6) * (boss ? 2 : 1)) };
}
async function startBattle(mode = 'story', st){
  if(!st) st = mode === 'steel' ? S.ss : S.stage;
  S.hp = MHP();
  view = 'battle'; msg = ''; pageAnim = true;
  B = { mode, stage:st, en:makeEnemy(mode, st), log:[], defend:0, stun:false, menu:false, over:false, busy:true, cd:{}, buff:{atk:0,iron:0}, turn:1 };
  const e = B.en, first = e.spd > spd();
  B.log.push(`A wild ${e.n} appears!`);
  B.log.push(first ? `${e.n} is faster (SPEED ${e.spd} vs ${spd()}) and attacks first!`
                   : e.spd === spd() ? `Equal speed (${spd()}) — you move first!` : `You are faster (SPEED ${spd()} vs ${e.spd}) — you move first!`);
  render(); window.scrollTo(0,0);
  await wait(950);
  if(first){
    await enemyTurn($('pl'), $('en'));
    if(S.hp <= 0){ await fallFx(); lose(); }
  }
  B.busy = false; refresh();
}
function ambient(){
  let h = '';
  if(B && B.mode === 'steel'){
    for(let i=0;i<10;i++) h += `<i class="sand" style="top:${20+(i*37)%70}%;animation-delay:-${i*0.6}s;animation-duration:${2.2+(i%4)*.5}s"></i>`;
    return h;
  }
  for(let i=0;i<7;i++) h += `<i class="ff" style="left:${8+i*13}%;top:${30+(i*23)%45}%;animation-delay:-${i*0.9}s;animation-duration:${5+i%3}s"></i>`;
  for(let i=0;i<4;i++) h += `<i class="lf" style="left:${10+i*24}%;animation-delay:-${i*2.2}s;animation-duration:${8+i}s"></i>`;
  return h;
}

    <button class="warn" onclick="act('run')" ${dis || (e.boss?'disabled':'')}>${IC.run} Run</button></div>`;

// ---- Effect helpers ----
function center(el){
  const s = $('scene').getBoundingClientRect(), r = el.getBoundingClientRect();
  return { x:r.left - s.left + r.width/2, y:r.top - s.top + r.height/2 };
}
function spawn(cls, html, x, y){
  const d = document.createElement('div'); d.className = cls; d.innerHTML = html;
  d.style.left = x + 'px'; d.style.top = y + 'px'; $('scene').appendChild(d); return d;
}
function floatText(el, t, cls=''){
  const c = center(el), d = spawn('ft ' + cls, t, c.x, c.y - 40);
  an(d, [{transform:'translate(-50%,0) scale(.5)',opacity:0},
         {transform:'translate(-50%,-18px) scale(1.25)',opacity:1,offset:.2},
         {transform:'translate(-50%,-70px) scale(1)',opacity:0}],
     {duration:1100,easing:'ease-out'}).then(() => d.remove());
}
// particles: kind = spark | leaf | coin | fire
function burst(el, kind, n=6, spread=70, color){
  const c = center(el);
  for(let i=0;i<n;i++){
    const a = Math.random()*Math.PI*2, r = spread*(.5+Math.random()*.7);
    const d = spawn('pt ' + kind, '', c.x, c.y);
    if(color) d.style.setProperty('--c', color);
    an(d, [{transform:'translate(-50%,-50%) scale(.4) rotate(0)',opacity:1},
           {transform:`translate(calc(-50% + ${Math.cos(a)*r}px),calc(-50% + ${Math.sin(a)*r}px)) scale(1.1) rotate(${Math.random()*360}deg)`,opacity:0}],
       {duration:600+Math.random()*300,easing:'cubic-bezier(.2,.8,.3,1)'}).then(() => d.remove());
  }
}
function rise(el, kind, n=8, color){
  const c = center(el);
  for(let i=0;i<n;i++){
    const x = c.x + (Math.random()-.5)*70, d = spawn('pt ' + kind, kind==='plus' ? '+' : '', x, c.y + 25);
    if(color) d.style.setProperty('--c', color);
    an(d, [{transform:'translate(-50%,0) scale(.5)',opacity:0},
           {transform:'translate(-50%,-30px) scale(1)',opacity:1,offset:.3},
           {transform:`translate(-50%,-${70+Math.random()*30}px) scale(.6)`,opacity:0}],
       {duration:900,delay:i*70,easing:'ease-out'}).then(() => d.remove());
  }
}
function slash(el, color, big){
  const c = center(el), s = big ? 150 : 110;
  const d = spawn('slash', `<svg viewBox="0 0 100 100" width="${s}" height="${s}"><path d="M15 80 Q30 20 90 12 Q45 35 22 86Z" fill="${color}"/><path d="M22 76 Q38 30 84 16" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round"/></svg>`, c.x, c.y);
  return an(d, [{transform:'translate(-50%,-50%) rotate(-40deg) scale(.5)',opacity:0},
                {transform:'translate(-50%,-50%) rotate(0) scale(1.05)',opacity:1,offset:.35},
                {transform:'translate(-50%,-50%) rotate(15deg) scale(1.15)',opacity:0}],
     {duration:420,easing:'ease-out'}).then(() => d.remove());
}
function swing(el, ms=450){ el.classList.add('atk'); setTimeout(() => el.classList.remove('atk'), RM ? 0 : ms); }
const lunge = (el, dir, big) => { swing(el, big ? 520 : 440); SFX.play(big ? 'swingBig' : 'swing'); return an(el, [
  {transform:'translate(0,0) scale(1)'},
  {transform:`translate(${-14*dir}px,${8*dir}px) scale(.95)`, offset:.25},
  {transform:`translate(${(big?110:80)*dir}px,${-(big?60:45)*dir}px) scale(${big?1.2:1.1})`, offset:.55},
  {transform:'translate(0,0) scale(1)'}], {duration:big?520:440, easing:'ease-in-out'}); };
const hitFx = el => { el.classList.add('hurt'); setTimeout(() => el.classList.remove('hurt'), 380); return an(el, [
  {filter:'brightness(3) saturate(.3)',transform:'translateX(0)'},
  {transform:'translateX(-10px)'},{transform:'translateX(10px)'},{transform:'translateX(-5px)'},
  {filter:'brightness(1)',transform:'translateX(0)'}], {duration:360}); };
const charge = (el, col) => (SFX.play('charge'), an(el, [
  {filter:`drop-shadow(0 0 0 ${col})`,transform:'scale(1)'},
  {filter:`drop-shadow(0 0 16px ${col}) brightness(1.3)`,transform:'scale(1.08)',offset:.7},
  {filter:`drop-shadow(0 0 0 ${col})`,transform:'scale(1)'}], {duration:520}));
const shakeScene = () => an($('scene'), [
  {transform:'translate(0,0)'},{transform:'translate(-7px,4px)'},{transform:'translate(6px,-4px)'},
  {transform:'translate(-4px,2px)'},{transform:'translate(0,0)'}], {duration:320});
async function throwArc(from, to, html){
  const a = center(from), b = center(to), d = spawn('pt big', html, a.x, a.y);
  const dx = b.x-a.x, dy = b.y-a.y;
  await an(d, [{transform:'translate(-50%,-50%) rotate(0)'},
               {transform:`translate(calc(-50% + ${dx/2}px),calc(-50% + ${dy/2-90}px)) rotate(360deg)`},
               {transform:`translate(calc(-50% + ${dx}px),calc(-50% + ${dy}px)) rotate(720deg)`}],
     {duration:600,easing:'ease-in'});
  d.remove();
}
const deathFx = el => { SFX.play('poof'); burst(el,'spark',10,90,'#fff59d'); burst(el,'leaf',6,80); return an(el, [
  {transform:'scale(1) rotate(0)',opacity:1},
  {transform:'scale(1.2) rotate(8deg)',filter:'brightness(3)',opacity:1,offset:.3},
  {transform:'scale(.2) translateY(40px) rotate(-30deg)',opacity:0}], {duration:750,easing:'ease-in',fill:'forwards'}); };

// ---- Skill animations ----
function cls(el, c, ms){ el.classList.add(c); setTimeout(() => el.classList.remove(c), RM ? 0 : ms); }
async function thrustAnim(P, E){
  await charge(P, '#e8f4ff');
  cls(P, 'thrust', 520);
  const run = an(P, [{transform:'translate(0,0)'},{transform:'translate(-16px,4px)',offset:.25},
    {transform:'translate(135px,-50px)',offset:.55},{transform:'translate(135px,-50px)',offset:.7},{transform:'translate(0,0)'}],
    {duration:620,easing:'ease-in-out'});
  await wait(320); SFX.play('stab');
  const c = center(E), d = spawn('stab', '', c.x - 70, c.y + 4);
  an(d, [{transform:'scaleX(0)',opacity:1},{transform:'scaleX(1)',opacity:1,offset:.4},{transform:'scaleX(1.2) scaleY(.2)',opacity:0}],
     {duration:360,easing:'ease-out'}).then(() => d.remove());
  await run;
}
async function slamAnim(P, els){
  cls(P, 'slam', 760);
  const leap = an(P, [{transform:'translate(0,0)'},{transform:'translate(-10px,6px) scale(1.05,.92)',offset:.15},
    {transform:'translate(70px,-95px) rotate(-6deg)',offset:.5},{transform:'translate(110px,-20px) rotate(4deg)',offset:.72},
    {transform:'translate(110px,-20px) scale(1.08,.94)',offset:.8},{transform:'translate(0,0)'}], {duration:900,easing:'ease-in-out'});
  await wait(640);
  SFX.play('boom'); shakeScene();
  els.forEach(el => {
    const c = center(el);
    const w = spawn('wave', '', c.x, c.y + el.offsetHeight*.42);
    an(w, [{transform:'translate(-50%,-50%) scale(.2)',opacity:1},{transform:'translate(-50%,-50%) scale(2.6)',opacity:0}],
       {duration:600,easing:'ease-out'}).then(() => w.remove());
    burst(el, 'dust', 10, 90);
  });
  const sc = $('scene'), f = spawn('flash', '', 0, 0);
  an(f, [{opacity:.55},{opacity:0}], {duration:300}).then(() => f.remove());
  await leap;
}

// ---- Player turn + enemy turn ----
const fallFx = () => an($('pl'), [{opacity:1,transform:'none'},{opacity:.3,transform:'rotate(-80deg) translate(-10px,20px)'}], {duration:650,fill:'forwards'});
async function act(type, k){
  if(!B || B.over || B.busy) return;
  const e = B.en, K = type==='skill' ? SKILLS[k] : null;
  if((K && B.cd[k]) || (type==='item' && (!S.inv[k] || B.mode==='pvp')) || (type==='run' && e.boss)) return;
  B.busy = true; B.defend = 0; B.menu = false; refresh();
  const P = $('pl'), E = $('en');
  const slotIdx = K ? cs().skills.indexOf(k) : -1;

  if(K && K.kind==='hit'){
    if(slotIdx > 0) S.st.lasers++;
    const targets = [{e, el:E}];               // AOE skills hit every enemy (more enemies can be added later)
    if(K.anim==='thrust') await thrustAnim(P, E);
    else if(K.anim==='slam') await slamAnim(P, targets.map(t => t.el));
    else {
      if(slotIdx > 0) await charge(P, K.color || '#fff');
      await lunge(P, 1, K.big);
    }
    const boost = B.buff.atk ? 1.5 : 1;
    for(const t of targets){
      const isCrit = Math.random()*100 < crit();
      const d = Math.max(1, Math.round(skillDmg(K, boost) * (isCrit ? 2 : 1) * (1 - t.e.dp)));
      if(!K.anim) slash(t.el, K.color || (isCrit ? '#ffd54a' : '#ffffffcc'), K.big || isCrit);
      t.e.hp -= d; hitFx(t.el); SFX.play(isCrit ? 'crit' : 'hit');
      burst(t.el, K.fx || 'spark', slotIdx>0 ? 10 : (isCrit?8:4), slotIdx>0 ? 80 : 55, isCrit ? '#ffd54a' : (K.color || '#fff'));
      floatText(t.el, isCrit ? `CRIT -${d}` : `-${d}`, (isCrit || slotIdx>0) ? 'crit' : '');
      if(isCrit || K.big) shakeScene();
      B.log.push(`${isCrit ? 'Critical! ' : ''}${slotIdx>0 ? K.n : 'You'} ${slotIdx>0 ? 'hits' : 'strike'} ${K.aoe ? t.e.n+' ' : ''}for ${d} damage${slotIdx>0?'!':''}`);
    }
  } else if(K && K.kind==='heal'){
    S.st.lasers++;
    const b = S.hp; S.hp = Math.min(MHP(), S.hp + Math.round(atk()*K.healAtk));
    charge(P, '#8fd14f'); SFX.play('heal'); rise(P, 'plus', 9, '#b8ff5a'); floatText(P, `+${S.hp-b}`, 'heal');
    B.log.push(`${K.n} restores ${S.hp-b} HP`);
    await wait(500);
  } else if(K && K.kind==='guard'){
    S.st.lasers++;
    B.defend = K.block;
    SFX.play('guard');
    if(K.anim==='shield'){ cls(P, 'shieldup', 600); burst(P, 'spark', 8, 60, '#ffd54a'); }
    floatText(P, 'GUARD', 'mp');
    B.log.push(`${K.n}! You brace for the next hit`);
    refresh(); await wait(400);
  } else if(type==='item'){
    S.inv[k]--;
    if(k==='bomb'){
      SFX.play('throw'); await throwArc(P, E, ITEMS.bomb.icon());
      SFX.play('boom'); e.hp -= 45; hitFx(E); burst(E, 'fire', 12, 85); shakeScene();
      floatText(E, '-45', 'crit');
      B.log.push('The Fire Flask explodes for 45 damage!');
    } else if(k==='potion'){
      const b = S.hp; S.hp = Math.min(MHP(), S.hp + Math.round(MHP()*.35));
      SFX.play('potion'); rise(P, 'plus', 8, '#ff8a80'); floatText(P, '+' + (S.hp-b), 'heal');
      B.log.push(`Health Potion restores ${S.hp-b} HP`);
      await wait(500);
    } else if(k==='power'){
      B.buff.atk = 4; SFX.play('power'); charge(P, '#f2a51c'); rise(P, 'star', 8); floatText(P, 'ATK UP', 'big');
      B.log.push('Power Potion! ATK +50% for 3 turns');
      await wait(500);
    } else if(k==='iron'){
      B.buff.iron = 4; SFX.play('guard'); charge(P, '#b0bec5'); rise(P, 'plus', 8, '#e6eef2'); floatText(P, 'DEF UP', 'mp');
      B.log.push('Iron Skin! You take 50% less damage for 3 turns');
      await wait(500);
    }
  } else if(type==='run'){
    if(Math.random() < .5){
      await an(P, [{transform:'translateX(0)'},{transform:'translateX(-30px) scaleX(-1)',offset:.2},
                   {transform:'translateX(-360px) scaleX(-1)'}], {duration:600,easing:'ease-in',fill:'forwards'});
      SFX.play('run'); B.log.push('You got away safely!'); B.over = true; refill(); B.busy = false; save(); refresh(); return;
    }
    await an(P, [{transform:'translateX(0)'},{transform:'translateX(-30px) rotate(-12deg)'},{transform:'translateX(0)'}], {duration:400});
    floatText(P, "Can't escape!", '');
    B.log.push("Couldn't escape!");
  }
  if(K && CD[slotIdx]) B.cd[k] = CD[slotIdx] + 1;   // +1 because this turn's tick happens below
  if(K && K.cutCd){ const id = cs().skills[K.cutCd[0]];
    if(B.cd[id] > 0){ B.cd[id] = Math.max(0, B.cd[id] - K.cutCd[1]); B.log.push(`${SKILLS[id].n} cooldown -${K.cutCd[1]}`); } }
  if(K && K.resetCd){ const id = cs().skills[K.resetCd];
    if(B.cd[id] > 0){ B.cd[id] = 0; B.log.push(`${SKILLS[id].n} is ready again!`); } }
  refresh();

  if(e.hp <= 0){
    await wait(250); await deathFx(E);
    burst(E, 'coin', 7, 60);
    const lv0 = S.lv; win(); refresh(); SFX.play('win');
    if(S.lv > lv0){ await wait(700); SFX.play('levelup'); floatText(P, 'LEVEL UP!', 'big'); rise(P, 'star', 10); charge(P, '#ffd54a'); }
    B.busy = false; save(); refresh(); return;
  }

  await wait(450);
  await enemyTurn(P, E);
  if(S.hp <= 0){ await wait(250); await fallFx(); lose(); B.busy = false; save(); refresh(); return; }
  // end of round: cooldowns and buffs tick down
  for(const id in B.cd) if(B.cd[id] > 0) B.cd[id]--;
  if(B.buff.atk) B.buff.atk--;
  if(B.buff.iron) B.buff.iron--;
  B.turn++;
  B.busy = false; save(); refresh();
}
async function enemyTurn(P, E){
  const e = B.en;
  if(B.stun){
    B.stun = false;
    an(E, [{transform:'rotate(0)'},{transform:'rotate(-8deg)'},{transform:'rotate(8deg)'},{transform:'rotate(0)'}], {duration:500});
    floatText(E, 'Stunned!', 'mp'); B.log.push(`${e.n} is stunned and can't move!`);
    refresh(); await wait(600); return;
  }
  const heavy = Math.random() < (e.boss ? .3 : .18);
  if(heavy){ floatText(E, '!!', 'crit'); await charge(E, '#ff5a4a'); }
  await lunge(E, -1, heavy);
  let d = Math.max(1, Math.round(e.atk * rnd(.9,1.1) * (heavy ? 1.5 : 1) * (1 - def()/100)));
  if(B.defend) d = Math.max(1, Math.round(d * (1 - B.defend)));
  if(B.buff.iron) d = Math.max(1, Math.round(d * .5));
  S.hp = Math.max(0, S.hp - d);
  hitFx(P); SFX.play((B.defend || B.buff.iron) ? 'guard' : heavy ? 'crit' : 'hurt'); burst(P, 'spark', 4, 45, (B.defend || B.buff.iron) ? '#8fd14f' : '#ff8a80');
  floatText(P, `-${d}`, heavy ? 'crit' : '');
  if(heavy) shakeScene();
  const g = (B.defend || B.buff.iron) ? ' (blocked some)' : '';
  B.log.push(heavy ? `${e.n} unleashes a heavy attack! You take ${d}${g}` : `${e.n} attacks! You take ${d}${g}`);
  B.defend = 0;
  refresh();
  await wait(300);
}
function win(){
  const e = B.en; B.over = true;
  S.gold += e.gold; S.exp += e.exp; S.st.wins++; if(e.boss) S.st.bosses++;
  B.log.push(`Victory! +${e.gold} gold and +${e.exp} EXP`);
  if(Math.random() < (e.boss ? 1 : .3)){
    const ks = Object.keys(ITEMS), d = ks[Math.floor(Math.random()*ks.length)];
    S.inv[d] = (S.inv[d]||0) + 1;
    B.log.push(`Found ${/^[AEIOU]/.test(ITEMS[d].n)?'an':'a'} ${ITEMS[d].n}!`);
  }
  B.won = true;
  if(B.mode === 'steel'){
    const pw = POWDER_PER(B.stage); S.powder += pw;
    B.log.push(`Collected ${pw} Magic Powder! (you have ${S.powder})`);
    if(B.stage === S.ss){ S.ss++; B.log.push(`Steel Sand stage ${S.ss} unlocked!`); }
  } else {
    if(e.boss) B.log.push(`Chapter ${chapIdx(S.stage)+1} complete! A new chapter is unlocked.`);
    S.stage++; S.best = Math.max(S.best, S.stage);
  }
  while(S.exp >= expNeed()){
    S.exp -= expNeed(); S.lv++; S.gold += LV_GOLD(S.lv);
    B.log.push(`Level up! You are now Lv.${S.lv} (+${LV_GOLD(S.lv)} gold)`);
  }
  refill();
}
// after every fight: HP back to full
function refill(){ S.hp = MHP(); B.log.push('HP fully restored.'); }
function lose(){
  B.over = true; SFX.play('lose');
  // no gold lost — you just go back to the first stage of the current base (every 5 stages is one base)
  const baseStart = st => Math.floor((st-1)/5)*5 + 1;
  if(B.mode === 'steel'){
    if(B.stage === S.ss && S.ss !== baseStart(S.ss)){ S.ss = baseStart(S.ss); }
    B.log.push(`You were defeated... no reward. Steel Sand restarts at stage ${S.ss}.`);
  } else {
    S.stage = baseStart(S.stage);
    B.log.push(`You were defeated... no reward. Back to the start of base ${chapIdx(S.stage)+1} (stage ${S.stage}).`);
  }
  refill();
}

// ====== Save / load with a code ======
function exportCode(){ return btoa(unescape(encodeURIComponent(JSON.stringify(S)))); }
function saveView(){
  return `<div class="card"><h2>Save / Settings</h2>
    <p class="small">${storageOK ? `Auto-saves on this device every time you play${CUR ? ` (account: ${esc(CUR)})` : ' (Guest)'}.` : 'This browser blocks auto-save. Use the save code below instead.'}</p>
    <p class="small">Save code: copy and keep it to load your progress on another device or if your data is lost.</p>
    <textarea id="code" readonly onclick="this.select()">${exportCode()}</textarea>
    <button class="full" onclick="copyCode()">${IC.copy} Copy code</button>
    <p class="small" style="margin-top:12px">Load from a save code:</p>
    <textarea id="imp" placeholder="Paste a save code here"></textarea>
    <div class="btns" style="margin-top:6px">
      <button onclick="importCode()">Load</button>
      <button class="warn" onclick="resetGame()">${resetArm ? 'Tap again to confirm' : 'New game'}</button>
    </div>${note()}${back()}</div>`;
}
function copyCode(){
  const t = $('code'); t.select();
  const done = () => { msg = 'Copied!'; render(); };
  if(navigator.clipboard) navigator.clipboard.writeText(t.value).then(done, () => { document.execCommand('copy'); done(); });
  else { document.execCommand('copy'); done(); }
}
function importCode(){
  try{
    const o = JSON.parse(decodeURIComponent(escape(atob($('imp').value.trim()))));
    if(typeof o.lv !== 'number' || !o.inv) throw 0;
    S = fix(o); save(); msg = 'Save loaded!';
  } catch(e){ msg = 'Invalid save code'; }
  render();
}
function resetGame(){
  if(!resetArm){ resetArm = true; msg = ''; render(); return; }
  S = newGame(); save(); resetArm = false; msg = 'Started a new game.'; render();
}

render();
fbInit();
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
