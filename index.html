<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>STAR QUEST</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#070b1a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="STAR QUEST">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{touch-action:manipulation;-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;font-family:system-ui,"Noto Sans Thai",sans-serif;background:#070b1a;color:#e6f1ff;
  -webkit-user-select:none;user-select:none;overscroll-behavior:none}
#app{max-width:520px;margin:0 auto;padding:12px;padding-top:max(12px,env(safe-area-inset-top));padding-bottom:max(16px,env(safe-area-inset-bottom))}
h1{font-size:20px;text-align:center;color:#5ef2ff;letter-spacing:3px;margin:4px 0 10px;text-shadow:0 0 10px #5ef2ff88}
h2{font-size:17px;margin:0 0 8px}
.card{background:#0f1730;border:1px solid #1f3a66;border-radius:14px;padding:12px;margin-bottom:10px}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between}
.bar{height:10px;background:#1a2340;border-radius:6px;overflow:hidden;margin:3px 0 6px}
.bar>i{display:block;height:100%;transition:width .3s}
.hp>i{background:linear-gradient(90deg,#ff4d6d,#ff8fa3)}
.mp>i{background:linear-gradient(90deg,#3a86ff,#5ef2ff)}
.ex>i{background:linear-gradient(90deg,#ffd60a,#ffef9f)}
.qb>i{background:linear-gradient(90deg,#06d6a0,#9ef01a)}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
button{font:inherit;font-size:15px;padding:12px;border-radius:10px;border:1px solid #2d5a9e;background:#14244a;color:#e6f1ff;cursor:pointer}
button:active{transform:scale(.96)}
button:disabled{opacity:.4;cursor:default}
button.pri{background:#0b6e8a;border-color:#5ef2ff}
button.warn{background:#5a1a2a;border-color:#ff4d6d}
button.ok{background:#0d5c44;border-color:#06d6a0}
.full{width:100%;margin-top:8px}
.small{font-size:13px;color:#9fb3d9}
.msg{color:#ffd60a;font-size:14px;margin:8px 0 0}
/* การ์ดสเตตัวละคร */
.hero{background:linear-gradient(160deg,#13224a,#0f1730 60%);border-color:#2d5a9e}
.avatar{width:64px;height:64px;border-radius:16px;background:#070b1a;border:2px solid #5ef2ff;display:flex;align-items:center;justify-content:center;font-size:38px;flex-shrink:0}
.tag{display:inline-block;background:#5ef2ff22;color:#5ef2ff;border:1px solid #5ef2ff66;border-radius:8px;padding:1px 8px;font-size:12px;margin-left:4px}
.gold{font-weight:700;color:#ffd60a;white-space:nowrap}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:8px 0}
.stat{background:#070b1a;border-radius:10px;padding:6px 4px;text-align:center}
.stat b{display:block;font-size:16px}
.stat span{font-size:11px;color:#9fb3d9}
.mini{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mini button{padding:8px;font-size:13px}
/* ปุ่มเมนูหลัก */
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{position:relative;aspect-ratio:1/1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:6px;font-size:13px;line-height:1.3;text-align:center;border-radius:14px;background:#0f1730;border:1px solid #2d5a9e}
.tile .ic{font-size:34px}
.badge{position:absolute;top:6px;right:6px;background:#ff4d6d;color:#fff;border-radius:10px;font-size:11px;padding:1px 6px}
.badge.soon{background:#334;color:#9fb3d9}
/* ต่อสู้ */
#log{height:110px;overflow-y:auto;font-size:14px;line-height:1.6}
/* ฉากต่อสู้ */
.scene{position:relative;height:300px;border-radius:16px;overflow:hidden;margin-bottom:10px;border:1px solid #2d5a9e;
  background:radial-gradient(ellipse at 75% 15%,#2a3f80 0%,#121d42 45%,#070b1a 80%)}
.v-battle .scene::after{content:'';position:absolute;left:0;right:0;bottom:0;height:38%;
  background:linear-gradient(180deg,transparent,#0b1a3a 40%,#0f2550);border-top:1px solid #5ef2ff22;z-index:0}
.stars{position:absolute;inset:0;opacity:.7;background-size:180px 180px;animation:drift 30s linear infinite;
  background-image:radial-gradient(1.5px 1.5px at 20px 30px,#fff,transparent),radial-gradient(1px 1px at 90px 80px,#cfe,transparent),
  radial-gradient(2px 2px at 150px 20px,#fff,transparent),radial-gradient(1px 1px at 60px 140px,#fff,transparent),radial-gradient(1.5px 1.5px at 130px 120px,#9ef,transparent)}
.stars.s2{background-size:260px 260px;opacity:.4;animation-duration:55s}
@keyframes drift{to{background-position:-360px 0}}
.ent{position:absolute;z-index:2;line-height:1;text-align:center}
.ent .spr{display:inline-block;animation:bob 2.4s ease-in-out infinite}
.en{right:11%;top:66px;animation:inR .7s cubic-bezier(.2,.9,.3,1.2) backwards}
.pl{left:9%;bottom:44px;animation:inL .7s cubic-bezier(.2,.9,.3,1.2) .15s backwards}
.en .spr{font-size:76px;animation-delay:-1.2s}
.pl .spr{font-size:66px}
.boss .spr{font-size:100px;filter:drop-shadow(0 0 16px #ff4d6d)}
.boss{top:44px}
.pad{position:absolute;z-index:1;width:130px;height:28px;border-radius:50%;background:radial-gradient(#5ef2ff40,transparent 70%)}
.pe{right:calc(11% - 18px);top:140px}.v-battle .boss~.pad{}
.pp{left:calc(9% - 22px);bottom:30px}
.ent.guard::after{content:'';position:absolute;inset:-14px;border-radius:50%;border:3px solid #5ef2ff;
  box-shadow:0 0 18px #5ef2ff,inset 0 0 18px #5ef2ff66;animation:pulse 1s ease-in-out infinite}
.plate{position:absolute;z-index:3;width:48%;background:#0b1430e6;border:1px solid #2d5a9e;border-radius:10px;padding:6px 8px;font-size:12px}
.plate .bar{height:7px;margin:3px 0}
.plate.e{left:8px;top:8px}.plate.p{right:8px;bottom:8px}
.ft{position:absolute;z-index:6;pointer-events:none;white-space:nowrap;font-weight:900;font-size:24px;color:#fff;
  text-shadow:0 2px 0 #000,0 0 10px #ff4d6d}
.ft.crit{font-size:32px;color:#ffd60a;text-shadow:0 2px 0 #000,0 0 12px #ff8800}
.ft.heal{color:#b8ff5a;text-shadow:0 2px 0 #000,0 0 10px #06d6a0}
.ft.mp{color:#7ff7ff;text-shadow:0 2px 0 #000,0 0 10px #3a86ff}
.ft.big{font-size:30px;color:#ffd60a;text-shadow:0 2px 0 #000,0 0 16px #ffd60a}
.pt{position:absolute;z-index:5;pointer-events:none;font-size:22px;transform:translate(-50%,-50%)}
.pt.sm{font-size:16px}.pt.big{font-size:34px}
.beam{position:absolute;z-index:4;height:10px;border-radius:5px;transform-origin:0 50%;pointer-events:none;
  background:linear-gradient(90deg,#fff,#5ef2ff 30%,#3a86ff);box-shadow:0 0 12px #5ef2ff,0 0 28px #3a86ff}
@keyframes bob{50%{transform:translateY(-8px)}}
@keyframes pulse{50%{transform:scale(1.06);opacity:.7}}
@keyframes inR{from{transform:translateX(160px);opacity:0}}
@keyframes inL{from{transform:translateX(-160px);opacity:0}}
/* แอนิเมชันหน้าเมนู */
.page{animation:fadeUp .35s ease-out}
.page .tile{animation:pop .45s cubic-bezier(.2,.9,.3,1.3) backwards}
.page .tile:nth-child(2){animation-delay:.05s}.page .tile:nth-child(3){animation-delay:.1s}
.page .tile:nth-child(4){animation-delay:.15s}.page .tile:nth-child(5){animation-delay:.2s}
.avatar{animation:bob 2.6s ease-in-out infinite}
.tile .ic{display:inline-block;transition:transform .2s}
.tile:active .ic{transform:scale(1.25) rotate(-8deg)}
.hero{position:relative;overflow:hidden}
.hero::before{content:'';position:absolute;top:0;left:-60%;width:40%;height:100%;pointer-events:none;
  background:linear-gradient(100deg,transparent,#ffffff14,transparent);animation:shine 5s ease-in-out infinite}
@keyframes shine{0%,60%{left:-60%}100%{left:130%}}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}}
@keyframes pop{from{opacity:0;transform:scale(.6)}}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
.item{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid #1f3a66}
.item:last-child{border:0}
.item button{padding:8px 12px;font-size:14px;white-space:nowrap}
.dots{display:flex;gap:6px;margin:8px 0}
.dots i{flex:1;height:8px;border-radius:4px;background:#1a2340}
.dots i.on{background:#5ef2ff}
.dots i.boss{background:#5a1a2a}
.dots i.boss.on{background:#ffd60a}
.story{font-size:14px;line-height:1.7;color:#cfe0ff;background:#070b1a;border-radius:10px;padding:10px;margin:8px 0}
.chars{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ch{border:1px solid #2d5a9e;border-radius:12px;padding:8px 4px;text-align:center;font-size:12px;background:#070b1a}
.ch .e{font-size:32px}
.ch.sel{border-color:#5ef2ff;box-shadow:0 0 8px #5ef2ff66}
.ch.lock{opacity:.45}
textarea{width:100%;height:70px;background:#070b1a;color:#5ef2ff;border:1px solid #2d5a9e;border-radius:8px;font-size:16px;padding:6px;-webkit-user-select:text;user-select:text}
</style>
</head>
<body>
<div id="app"></div>
<script>
// ====== ข้อมูลเกม (แก้ชื่อ/ราคา/ค่าพลังได้ตรงนี้) ======
const KEY = 'starquest_save_v1';

// ตัวละคร — เพิ่มตัวใหม่ได้ที่นี่
const CHARS = {
  pilot: { n:'นักบินอวกาศ', e:'🧑‍🚀', d:'สมดุลทุกด้าน' }
};
const ITEMS = {
  potion: { n:'ยาฟื้นพลัง',      e:'🧪', d:'ฟื้น HP 40',                 p:20 },
  ether:  { n:'แบตเตอรี่พลังงาน', e:'🔋', d:'ฟื้น MP 15',                 p:25 },
  bomb:   { n:'ระเบิดพลาสมา',    e:'💣', d:'ศัตรูโดน 35 ดาเมจ (ใช้ตอนสู้)', p:40, battleOnly:true }
};
const GEAR = {
  w1: { n:'ปืนเลเซอร์',      e:'🔫', t:'atk', v:5,  p:80  },
  w2: { n:'ดาบพลาสมา',      e:'🗡️', t:'atk', v:12, p:220 },
  w3: { n:'ปืนใหญ่ควอนตัม',  e:'☄️', t:'atk', v:22, p:500 },
  a1: { n:'เกราะนาโน',       e:'🦺', t:'def', v:4,  p:100 },
  a2: { n:'เกราะไททาเนียม',  e:'🛡️', t:'def', v:9,  p:260 },
  a3: { n:'โล่พลังงาน',      e:'💠', t:'def', v:16, p:550 }
};
const MAX_UP = 10;
const ENEMIES = [
  {n:'หุ่นสอดแนม',e:'🤖'},{n:'สไลม์อวกาศ',e:'🦠'},{n:'แมงมุมเหล็ก',e:'🕷️'},
  {n:'โจรอวกาศ',e:'👾'},{n:'ยานรบไร้คนขับ',e:'🛸'}
];
const BOSSES = [{n:'ราชาเอเลี่ยน',e:'👽'},{n:'มังกรดวงดาว',e:'🐉'},{n:'AI ผู้พิทักษ์',e:'🧠'}];
const CHAPTERS = [
  { n:'ชายแดนดวงดาว', t:'สัญญาณขอความช่วยเหลือดังมาจากชายแดนกาแล็กซี หุ่นสอดแนมปริศนากำลังบุกฐานทัพ คุณคือนักบินคนเดียวที่ยังเหลืออยู่...' },
  { n:'เนบิวลาสีเลือด', t:'ร่องรอยของศัตรูพาคุณเข้าสู่เนบิวลาสีแดง ที่นี่มีสัตว์ประหลาดที่กลายพันธุ์จากพลังงานดวงดาว และมีบางอย่างตัวใหญ่รออยู่ข้างใน...' },
  { n:'แกนกลาง AI', t:'เบื้องหลังทุกอย่างคือ AI ที่ควบคุมกองทัพหุ่นยนต์ คุณต้องบุกเข้าไปในแกนกลางของมันเพื่อหยุดการโจมตีให้ได้!' },
  { n:'ห้วงอวกาศลึก', t:'AI ถูกหยุดแล้ว แต่สัญญาณใหม่ดังมาจากห้วงอวกาศที่ไม่มีใครเคยไป ศัตรูเก่งขึ้นเรื่อย ๆ ...การผจญภัยยังไม่จบ' }
];
// เควส: ทำครบแต่ละขั้นแล้วกดรับรางวัล
const QUESTS = [
  { id:'win',   n:'ชนะการต่อสู้',  s:'wins',   g:[3,10,25,50,100,200], r:t=>({gold:30*(t+1)}) },
  { id:'boss',  n:'ล้มบอส',        s:'bosses', g:[1,3,5,10,20],        r:t=>({gold:100*(t+1), item:'bomb'}) },
  { id:'laser', n:'ใช้เลเซอร์',     s:'lasers', g:[5,20,50,100,200],    r:t=>({gold:40*(t+1), item:'ether'}) },
  { id:'buy',   n:'ซื้อของในร้าน',  s:'buys',   g:[1,5,15,30,60],       r:t=>({gold:30*(t+1), item:'potion'}) },
  { id:'lv',    n:'เลเวลถึง',       s:'lv',     g:[3,5,10,15,20,30],    r:t=>({gold:80*(t+1)}) }
];

// ====== กันการซูมบนมือถือ ======
['gesturestart','gesturechange','gestureend'].forEach(ev =>
  document.addEventListener(ev, e => e.preventDefault(), {passive:false}));
document.addEventListener('touchmove', e => { if(e.touches.length > 1) e.preventDefault(); }, {passive:false});

// ====== สถานะ & การบันทึก ======
let storageOK = true;
function newGame(){
  return {char:'pilot',lv:1,exp:0,hp:60,mhp:60,mp:20,mmp:20,batk:10,bdef:3,gold:30,stage:1,best:1,
          inv:{potion:3,ether:1,bomb:1},gear:[],w:null,a:null,up:{},
          st:{wins:0,bosses:0,lasers:0,buys:0},qt:{}};
}
function fix(o){
  const s = Object.assign(newGame(), o);
  if(!o.st) s.st = {wins:o.wins||0, bosses:Math.floor(((o.stage||1)-1)/5), lasers:0, buys:0};
  if(!CHARS[s.char]) s.char = 'pilot';
  return s;
}
function load(){
  try{ const t = localStorage.getItem(KEY); return t ? fix(JSON.parse(t)) : null; }
  catch(e){ storageOK = false; return null; }
}
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(S)); }
  catch(e){ storageOK = false; }
}
let S = load() || newGame();
let B = null, view = 'home', msg = '', resetArm = false;

const gearVal = k => GEAR[k].v + Math.ceil(GEAR[k].v*.3) * (S.up[k]||0);
const upCost  = k => Math.round(GEAR[k].p * .6 * ((S.up[k]||0) + 1));
const atk = () => S.batk + (S.w ? gearVal(S.w) : 0);
const def = () => S.bdef + (S.a ? gearVal(S.a) : 0);
const expNeed = () => 20 + S.lv * 15;
const rnd = (a,b) => a + Math.random()*(b-a);
const dmgCalc = (a,d,m=1) => Math.max(1, Math.round((a*rnd(.85,1.15) - d*.6) * m));
const ch = () => CHARS[S.char];
const chapIdx = st => Math.floor((st-1)/5);
const chap = i => CHAPTERS[Math.min(i, CHAPTERS.length-1)];
const qVal = q => q.s==='lv' ? S.lv : (S.st[q.s]||0);
const qReady = q => { const t = S.qt[q.id]||0; return t < q.g.length && qVal(q) >= q.g[t]; };

// ====== หน้าจอ ======
let pageAnim = true;
function go(v){ view = v; msg = ''; resetArm = false; pageAnim = true; if(v !== 'battle') B = null; render(); window.scrollTo(0,0); }
function bar(c,v,m){ return `<div class="bar ${c}"><i style="width:${Math.max(0,Math.min(100,v/m*100))}%"></i></div>`; }
function back(){ return `<button class="full" onclick="go('home')">⬅️ กลับหน้าหลัก</button>`; }
function note(){ return msg ? `<p class="msg">${msg}</p>` : ''; }

function render(){
  let h = '';
  if(view==='home') h += heroCard() + menu();
  else if(view==='battle') h += battle();
  else {
    h += topBar();
    if(view==='quest') h += quest();
    else if(view==='story') h += story();
    else if(view==='shop') h += shop();
    else if(view==='pvp') h += pvp();
    else if(view==='set') h += setView();
    else if(view==='save') h += saveView();
  }
  document.getElementById('app').innerHTML =
    `<h1>🚀 STAR QUEST</h1><div class="${pageAnim ? 'page' : ''} v-${view}">${h}</div>`;
  pageAnim = false;
  if(view==='battle') refresh();
}

// การ์ดสเตตัวละคร (หน้าหลัก)
function heroCard(){
  const c = ch(), ci = chapIdx(S.stage);
  return `<div class="card hero">
    <div class="row" style="justify-content:flex-start">
      <div class="avatar">${c.e}</div>
      <div style="flex:1;min-width:0"><b>${c.n}</b><span class="tag">Lv.${S.lv}</span>
        <div class="small">🗺️ บทที่ ${ci+1} · ด่าน ${S.stage}</div></div>
      <div class="gold">💰 ${S.gold}</div>
    </div>
    <div style="margin-top:10px">
      <div class="row small"><span>HP</span><span>${S.hp}/${S.mhp}</span></div>${bar('hp',S.hp,S.mhp)}
      <div class="row small"><span>MP</span><span>${S.mp}/${S.mmp}</span></div>${bar('mp',S.mp,S.mmp)}
      <div class="row small"><span>EXP</span><span>${S.exp}/${expNeed()}</span></div>${bar('ex',S.exp,expNeed())}
    </div>
    <div class="stats">
      <div class="stat"><b>${atk()}</b><span>⚔️ โจมตี</span></div>
      <div class="stat"><b>${def()}</b><span>🛡️ ป้องกัน</span></div>
      <div class="stat"><b>${S.st.wins}</b><span>🏆 ชนะ</span></div>
      <div class="stat"><b>${S.st.bosses}</b><span>👑 บอส</span></div>
    </div>
    <div class="mini">
      <button onclick="rest()">🛏️ พักฟื้น (10💰)</button>
      <button onclick="go('save')">⚙️ เซฟ / ตั้งค่า</button>
    </div>${note()}
  </div>`;
}
function topBar(){
  return `<div class="card"><div class="row"><b>${ch().e} Lv.${S.lv}</b><span class="gold">💰 ${S.gold}</span></div>
    <div class="row small"><span>HP ${S.hp}/${S.mhp}</span><span>MP ${S.mp}/${S.mmp}</span></div>
    ${bar('hp',S.hp,S.mhp)}${bar('mp',S.mp,S.mmp)}</div>`;
}
function tile(v, ic, label, badge){
  return `<button class="tile" onclick="go('${v}')"><span class="ic">${ic}</span><span>${label}</span>${badge||''}</button>`;
}
function menu(){
  const ready = QUESTS.filter(qReady).length;
  return `<div class="tiles">
    ${tile('quest','📜','เควส<br>ต่าง ๆ', ready ? `<span class="badge">${ready}</span>` : '')}
    ${tile('story','🚀','Story<br>Mode', S.stage%5===0 ? '<span class="badge">บอส</span>' : '')}
    ${tile('shop','🏪','ร้านค้า')}
    ${tile('pvp','⚔️','สร้างห้อง<br>PVP','<span class="badge soon">เร็ว ๆ นี้</span>')}
    ${tile('set','🛠️','อัปเกรด /<br>จัดเซ็ต')}
  </div>`;
}

function rest(){
  if(S.hp===S.mhp && S.mp===S.mmp) msg = 'HP และ MP เต็มอยู่แล้ว';
  else if(S.gold < 10) msg = 'เงินไม่พอ';
  else { S.gold -= 10; S.hp = S.mhp; S.mp = S.mmp; msg = '😴 พักผ่อนแล้ว HP/MP เต็ม!'; save(); }
  render();
}

// ---- เควส ----
function quest(){
  let h = '<div class="card"><h2>📜 เควสต่าง ๆ</h2>';
  QUESTS.forEach(q => {
    const t = S.qt[q.id]||0, done = t >= q.g.length;
    if(done){ h += `<div class="item"><div>${q.n}<div class="small">✅ สำเร็จครบทุกขั้นแล้ว</div></div></div>`; return; }
    const goal = q.g[t], v = Math.min(qVal(q), goal), r = q.r(t);
    h += `<div class="item"><div style="flex:1">${q.n} ${goal} ${q.s==='lv'?'':'ครั้ง'} <span class="small">(ขั้น ${t+1}/${q.g.length})</span>
      ${bar('qb',v,goal)}<div class="small">${v}/${goal} · รางวัล ${r.gold}💰${r.item ? ' + '+ITEMS[r.item].e : ''}</div></div>
      <button class="${qReady(q)?'ok':''}" onclick="claim('${q.id}')" ${qReady(q)?'':'disabled'}>รับ</button></div>`;
  });
  return h + note() + back() + '</div>';
}
function claim(id){
  const q = QUESTS.find(x => x.id===id); if(!q || !qReady(q)) return;
  const t = S.qt[id]||0, r = q.r(t);
  S.gold += r.gold; if(r.item) S.inv[r.item] = (S.inv[r.item]||0) + 1;
  S.qt[id] = t + 1;
  msg = `🎉 ได้รับ ${r.gold}💰${r.item ? ' และ '+ITEMS[r.item].e+' '+ITEMS[r.item].n : ''}`;
  save(); render();
}

// ---- Story Mode ----
function story(){
  const ci = chapIdx(S.stage), c = chap(ci), pos = (S.stage-1)%5;
  let dots = '';
  for(let i=0;i<5;i++) dots += `<i class="${i<=pos?'on':''} ${i===4?'boss':''}"></i>`;
  let past = '';
  for(let i=0;i<ci;i++) past += `<div class="small">✅ บทที่ ${i+1}: ${chap(i).n}</div>`;
  return `<div class="card"><h2>🚀 บทที่ ${ci+1}: ${c.n}</h2>
    <div class="story">${c.t}</div>
    <div class="row small"><span>ด่าน ${pos+1}/5</span><span>${pos===4?'⚠️ ด่านบอส!':'บอสอยู่ด่านที่ 5'}</span></div>
    <div class="dots">${dots}</div>
    <button class="pri full" onclick="startBattle()">⚔️ ออกสู้ ด่าน ${S.stage}</button>
    ${past ? `<div style="margin-top:12px">${past}</div>` : ''}
    ${note()}${back()}</div>`;
}

// ---- ร้านค้า ----
function shop(){
  let h = '<div class="card"><h2>🏪 ร้านค้า</h2><div class="small">ไอเทม</div>';
  for(const k in ITEMS){ const it = ITEMS[k];
    h += `<div class="item"><div>${it.e} ${it.n}<div class="small">${it.d} · มี ${S.inv[k]||0}</div></div>
      <button onclick="buy('${k}')" ${S.gold<it.p?'disabled':''}>${it.p}💰</button></div>`;
  }
  h += '<div class="small" style="margin-top:10px">อุปกรณ์</div>';
  for(const k in GEAR){ const g = GEAR[k], own = S.gear.includes(k);
    h += `<div class="item"><div>${g.e} ${g.n}<div class="small">${g.t==='atk'?'โจมตี':'ป้องกัน'} +${g.v}</div></div>
      ${own ? '<span class="small">มีแล้ว</span>' : `<button onclick="buyGear('${k}')" ${S.gold<g.p?'disabled':''}>${g.p}💰</button>`}</div>`;
  }
  return h + note() + back() + '</div>';
}
function buy(k){
  const it = ITEMS[k]; if(S.gold < it.p) return;
  S.gold -= it.p; S.inv[k] = (S.inv[k]||0) + 1; S.st.buys++;
  msg = `ซื้อ ${it.e} ${it.n} แล้ว`; save(); render();
}
function buyGear(k){
  const g = GEAR[k]; if(S.gold < g.p || S.gear.includes(k)) return;
  S.gold -= g.p; S.gear.push(k); S.st.buys++;
  if(g.t==='atk') S.w = k; else S.a = k;
  msg = `ซื้อและสวม ${g.e} ${g.n} แล้ว`; save(); render();
}

// ---- PVP (ยังไม่เปิด) ----
function pvp(){
  return `<div class="card"><h2>⚔️ สร้างห้อง PVP</h2>
    <div class="story">โหมดสร้างห้องเพื่อสู้กับเพื่อนแบบออนไลน์กำลังพัฒนาอยู่ เร็ว ๆ นี้จะได้ส่งรหัสห้องให้เพื่อนแล้วสู้กันแบบเทิร์นได้!</div>
    ${back()}</div>`;
}

// ---- อัปเกรด / จัดเซ็ต ----
function setView(){
  let h = '<div class="card"><h2>🧑‍🚀 ตัวละคร</h2><div class="chars">';
  for(const k in CHARS){ const c = CHARS[k];
    h += `<div class="ch ${S.char===k?'sel':''}" onclick="pickChar('${k}')"><div class="e">${c.e}</div><b>${c.n}</b><div class="small">${c.d}</div></div>`;
  }
  for(let i = Object.keys(CHARS).length; i < 3; i++)
    h += `<div class="ch lock"><div class="e">🔒</div><b>???</b><div class="small">เร็ว ๆ นี้</div></div>`;
  h += '</div></div>';

  h += '<div class="card"><h2>🛠️ จัดเซ็ต & อัปเกรด</h2>';
  h += `<div class="row small"><span>อาวุธ: ${S.w ? GEAR[S.w].e+' '+GEAR[S.w].n+' +'+(S.up[S.w]||0) : 'ไม่มี'}</span>
        <span>เกราะ: ${S.a ? GEAR[S.a].e+' '+GEAR[S.a].n+' +'+(S.up[S.a]||0) : 'ไม่มี'}</span></div>`;
  if(!S.gear.length) h += '<p class="small">ยังไม่มีอุปกรณ์ ไปซื้อที่ร้านค้าได้</p>';
  S.gear.forEach(k => {
    const g = GEAR[k], on = S.w===k || S.a===k, lv = S.up[k]||0, max = lv >= MAX_UP;
    h += `<div class="item"><div style="flex:1">${g.e} ${g.n} <span class="tag">+${lv}</span>
        <div class="small">${g.t==='atk'?'โจมตี':'ป้องกัน'} +${gearVal(k)}${max?'':` → +${gearVal(k)+Math.ceil(g.v*.3)}`}</div></div>
      ${on ? '<span class="small">✅</span>' : `<button onclick="equip('${k}')">สวม</button>`}
      <button onclick="upgrade('${k}')" ${max||S.gold<upCost(k)?'disabled':''}>${max?'MAX':'⬆️ '+upCost(k)+'💰'}</button></div>`;
  });
  h += '</div>';

  h += '<div class="card"><h2>🎒 ไอเทม</h2>';
  let any = false;
  for(const k in ITEMS){ const n = S.inv[k]||0; if(!n) continue; any = true; const it = ITEMS[k];
    h += `<div class="item"><div>${it.e} ${it.n} x${n}<div class="small">${it.d}</div></div>
      ${it.battleOnly ? '' : `<button onclick="useItem('${k}')">ใช้</button>`}</div>`;
  }
  if(!any) h += '<p class="small">ไม่มีไอเทม</p>';
  return h + note() + back() + '</div>';
}
function pickChar(k){ if(!CHARS[k]) return; S.char = k; save(); render(); }
function equip(k){
  if(GEAR[k].t==='atk') S.w = k; else S.a = k;
  msg = `สวม ${GEAR[k].e} ${GEAR[k].n} แล้ว`; save(); render();
}
function upgrade(k){
  const lv = S.up[k]||0, c = upCost(k);
  if(lv >= MAX_UP || S.gold < c) return;
  S.gold -= c; S.up[k] = lv + 1;
  msg = `⬆️ ${GEAR[k].e} ${GEAR[k].n} เป็น +${lv+1} แล้ว!`; save(); render();
}
function applyItem(k){
  if(k==='potion'){ const b = S.hp; S.hp = Math.min(S.mhp, S.hp+40); return `ฟื้น HP ${S.hp-b}`; }
  if(k==='ether'){ const b = S.mp; S.mp = Math.min(S.mmp, S.mp+15); return `ฟื้น MP ${S.mp-b}`; }
}
function useItem(k){
  if(!S.inv[k] || ITEMS[k].battleOnly) return;
  S.inv[k]--; msg = ITEMS[k].e + ' ' + applyItem(k); save(); render();
}

// ====== ระบบต่อสู้แบบเทิร์น (มีแอนิเมชัน) ======
const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
const $ = id => document.getElementById(id);
const wait = ms => new Promise(r => setTimeout(r, RM ? 0 : ms));
const an = (el, kf, opt) => el ? el.animate(kf, RM ? {...opt, duration:1} : opt).finished : Promise.resolve();
const pct = (v,m) => Math.max(0, Math.min(100, v/m*100)) + '%';

function makeEnemy(){
  const st = S.stage, boss = st % 5 === 0;
  const base = boss ? BOSSES[(st/5 - 1) % BOSSES.length] : ENEMIES[Math.floor(Math.random()*ENEMIES.length)];
  const hp = Math.round((30 + st*10) * (boss ? 1.8 : 1));
  return { n:(boss?'👑 ':'') + base.n, e:base.e, hp, mhp:hp, boss,
    atk: Math.round((5 + st*2.2) * (boss ? 1.15 : 1)),
    def: Math.round((1 + st*1.2) * (boss ? 1.2 : 1)),
    gold: Math.round((10 + st*6) * (boss ? 2 : 1)),
    exp:  Math.round((10 + st*6) * (boss ? 2 : 1)) };
}
function startBattle(){
  if(S.hp <= 0) S.hp = 1;
  view = 'battle'; msg = ''; pageAnim = true;
  B = { en:makeEnemy(), log:[], defend:false, menu:false, over:false, busy:false };
  B.log.push(`${B.en.e} ${B.en.n} ปรากฏตัว!`);
  render(); window.scrollTo(0,0);
}

// โครงฉาก (สร้างครั้งเดียว แล้วอัปเดตด้วย refresh)
function battle(){
  const e = B.en;
  return `<div class="scene" id="scene">
      <div class="stars"></div><div class="stars s2"></div>
      <div class="plate e"><div class="row"><b>${e.n}</b><span>ด่าน ${S.stage}</span></div>
        <div class="bar hp"><i id="enhp"></i></div><div class="small" id="enhpt"></div></div>
      <div class="pad pe"></div><div class="pad pp"></div>
      <div class="ent en ${e.boss?'boss':''}" id="en"><span class="spr">${e.e}</span></div>
      <div class="ent pl" id="pl"><span class="spr">${ch().e}</span></div>
      <div class="plate p"><div class="row"><b>${ch().n}</b><span>Lv.${S.lv}</span></div>
        <div class="bar hp"><i id="plhp"></i></div>
        <div class="bar mp"><i id="plmp"></i></div><div class="small" id="plt"></div></div>
    </div>
    <div class="card" id="log"></div>
    <div class="card" id="ctrl"></div>`;
}
function refresh(){
  if(view !== 'battle' || !B || !$('scene')) return;
  const e = B.en;
  $('enhp').style.width = pct(e.hp, e.mhp);
  $('enhpt').textContent = `HP ${Math.max(0,e.hp)}/${e.mhp}`;
  $('plhp').style.width = pct(S.hp, S.mhp);
  $('plmp').style.width = pct(S.mp, S.mmp);
  $('plt').textContent = `HP ${S.hp}/${S.mhp} · MP ${S.mp}/${S.mmp}`;
  $('pl').classList.toggle('guard', B.defend);
  const lg = $('log');
  lg.innerHTML = B.log.slice(-30).map(l => `<div>${l}</div>`).join('');
  lg.scrollTop = lg.scrollHeight;
  $('ctrl').innerHTML = controls();
}
function controls(){
  const e = B.en, dis = B.busy ? 'disabled' : '';
  if(B.over) return `<div class="btns"><button onclick="go('home')">🏠 หน้าหลัก</button>
      <button class="pri" onclick="startBattle()">⚔️ สู้ต่อ ด่าน ${S.stage}</button></div>`;
  if(B.menu){
    let h = '', any = false;
    for(const k in ITEMS){ const n = S.inv[k]||0; if(!n) continue; any = true;
      h += `<div class="item"><div>${ITEMS[k].e} ${ITEMS[k].n} x${n}<div class="small">${ITEMS[k].d}</div></div>
        <button onclick="act('item','${k}')" ${dis}>ใช้</button></div>`;
    }
    if(!any) h += '<p class="small">ไม่มีไอเทม</p>';
    return h + `<button class="full" onclick="B.menu=false;refresh()" ${dis}>⬅️ ย้อนกลับ</button>`;
  }
  return `<div class="btns">
    <button onclick="act('atk')" ${dis}>⚔️ โจมตี</button>
    <button onclick="act('laser')" ${dis || (S.mp<6?'disabled':'')}>⚡ เลเซอร์ (6MP)</button>
    <button onclick="act('fix')" ${dis || (S.mp<8?'disabled':'')}>🔧 ซ่อมแซม (8MP)</button>
    <button onclick="act('guard')" ${dis}>🛡️ ป้องกัน</button>
    <button onclick="B.menu=true;refresh()" ${dis}>🎒 ไอเทม</button>
    <button class="warn" onclick="act('run')" ${dis || (e.boss?'disabled':'')}>🏃 หนี</button></div>`;
}

// ---- ตัวช่วยเอฟเฟกต์ ----
function center(el){
  const s = $('scene').getBoundingClientRect(), r = el.getBoundingClientRect();
  return { x:r.left - s.left + r.width/2, y:r.top - s.top + r.height/2 };
}
function spawn(cls, html, x, y){
  const d = document.createElement('div'); d.className = cls; d.innerHTML = html;
  d.style.left = x + 'px'; d.style.top = y + 'px'; $('scene').appendChild(d); return d;
}
function floatText(el, t, cls=''){
  const c = center(el), d = spawn('ft ' + cls, t, c.x, c.y - 40);
  an(d, [{transform:'translate(-50%,0) scale(.5)',opacity:0},
         {transform:'translate(-50%,-18px) scale(1.25)',opacity:1,offset:.2},
         {transform:'translate(-50%,-70px) scale(1)',opacity:0}],
     {duration:1100,easing:'ease-out'}).then(() => d.remove());
}
function burst(el, emo, n=6, spread=70){
  const c = center(el);
  for(let i=0;i<n;i++){
    const a = Math.random()*Math.PI*2, r = spread*(.5+Math.random()*.7);
    const d = spawn('pt', emo, c.x, c.y);
    an(d, [{transform:'translate(-50%,-50%) scale(.4)',opacity:1},
           {transform:`translate(calc(-50% + ${Math.cos(a)*r}px),calc(-50% + ${Math.sin(a)*r}px)) scale(1.1)`,opacity:0}],
       {duration:600+Math.random()*300,easing:'cubic-bezier(.2,.8,.3,1)'}).then(() => d.remove());
  }
}
function sparkle(el, emo, n=8){
  const c = center(el);
  for(let i=0;i<n;i++){
    const x = c.x + (Math.random()-.5)*70, d = spawn('pt sm', emo, x, c.y + 25);
    an(d, [{transform:'translate(-50%,0) scale(.5)',opacity:0},
           {transform:'translate(-50%,-30px) scale(1)',opacity:1,offset:.3},
           {transform:`translate(-50%,-${70+Math.random()*30}px) scale(.6)`,opacity:0}],
       {duration:900,delay:i*70,easing:'ease-out'}).then(() => d.remove());
  }
}
const lunge = (el, dir, big) => an(el, [
  {transform:'translate(0,0) scale(1)'},
  {transform:`translate(${-14*dir}px,${8*dir}px) scale(.95)`, offset:.25},
  {transform:`translate(${(big?110:80)*dir}px,${-(big?60:45)*dir}px) scale(${big?1.25:1.12})`, offset:.55},
  {transform:'translate(0,0) scale(1)'}], {duration:big?520:420, easing:'ease-in-out'});
const hitFx = el => an(el, [
  {filter:'brightness(4) saturate(0)',transform:'translateX(0)'},
  {transform:'translateX(-10px)'},{transform:'translateX(10px)'},{transform:'translateX(-5px)'},
  {filter:'brightness(1)',transform:'translateX(0)'}], {duration:360});
const charge = (el, col) => an(el, [
  {filter:`drop-shadow(0 0 0 ${col})`,transform:'scale(1)'},
  {filter:`drop-shadow(0 0 22px ${col}) brightness(1.5)`,transform:'scale(1.1)',offset:.7},
  {filter:`drop-shadow(0 0 0 ${col})`,transform:'scale(1)'}], {duration:520});
const shakeScene = () => an($('scene'), [
  {transform:'translate(0,0)'},{transform:'translate(-7px,4px)'},{transform:'translate(6px,-4px)'},
  {transform:'translate(-4px,2px)'},{transform:'translate(0,0)'}], {duration:320});
async function beam(from, to){
  const a = center(from), b = center(to), ang = Math.atan2(b.y-a.y, b.x-a.x), len = Math.hypot(b.x-a.x, b.y-a.y);
  const d = spawn('beam', '', a.x, a.y - 5); d.style.width = len + 'px';
  const r = `rotate(${ang}rad)`;
  await an(d, [{transform:`${r} scaleX(0)`,opacity:1},{transform:`${r} scaleX(1)`,opacity:1,offset:.35},
               {transform:`${r} scaleX(1) scaleY(.2)`,opacity:0}], {duration:480,easing:'ease-out'});
  d.remove();
}
async function throwArc(from, to, emo){
  const a = center(from), b = center(to), d = spawn('pt big', emo, a.x, a.y);
  const dx = b.x-a.x, dy = b.y-a.y;
  await an(d, [{transform:'translate(-50%,-50%) rotate(0)'},
               {transform:`translate(calc(-50% + ${dx/2}px),calc(-50% + ${dy/2-90}px)) rotate(360deg)`},
               {transform:`translate(calc(-50% + ${dx}px),calc(-50% + ${dy}px)) rotate(720deg)`}],
     {duration:600,easing:'ease-in'});
  d.remove();
}
const deathFx = el => { burst(el,'💥',8,90); return an(el, [
  {transform:'scale(1) rotate(0)',opacity:1},
  {transform:'scale(1.3) rotate(15deg)',filter:'brightness(4)',opacity:1,offset:.3},
  {transform:'scale(0) rotate(-200deg)',opacity:0}], {duration:750,easing:'ease-in',fill:'forwards'}); };

// ---- เทิร์นของผู้เล่น + ศัตรู ----
async function act(type, k){
  if(!B || B.over || B.busy) return;
  const e = B.en;
  if((type==='laser' && S.mp<6) || (type==='fix' && S.mp<8) || (type==='item' && !S.inv[k]) || (type==='run' && e.boss)) return;
  B.busy = true; B.defend = false; B.menu = false; refresh();
  const P = $('pl'), E = $('en');

  if(type==='atk'){
    const crit = Math.random() < .12, d = dmgCalc(atk(), e.def, crit ? 1.7 : 1);
    await lunge(P, 1);
    e.hp -= d; hitFx(E); burst(E, crit?'💥':'✦', crit?6:3, 50);
    floatText(E, crit ? `CRIT -${d}` : `-${d}`, crit ? 'crit' : '');
    if(crit) shakeScene();
    B.log.push(crit ? `💥 คริติคอล! คุณโจมตี ${d} ดาเมจ` : `⚔️ คุณโจมตี ${d} ดาเมจ`);
  } else if(type==='laser'){
    S.mp -= 6; S.st.lasers++; refresh();
    const d = dmgCalc(atk()*1.8, e.def*.5);
    await charge(P, '#5ef2ff'); await beam(P, E);
    e.hp -= d; hitFx(E); burst(E, '⚡', 6, 60); shakeScene();
    floatText(E, `-${d}`, 'crit');
    B.log.push(`⚡ ยิงเลเซอร์ทะลวง ${d} ดาเมจ!`);
  } else if(type==='fix'){
    S.mp -= 8;
    const b = S.hp; S.hp = Math.min(S.mhp, S.hp + Math.round(S.mhp*.4));
    charge(P, '#9ef01a'); sparkle(P, '✨', 10); floatText(P, `+${S.hp-b}`, 'heal');
    B.log.push(`🔧 ซ่อมแซมตัวเอง ฟื้น HP ${S.hp-b}`);
    await wait(500);
  } else if(type==='guard'){
    B.defend = true; S.mp = Math.min(S.mmp, S.mp+3);
    floatText(P, '+3 MP', 'mp');
    B.log.push('🛡️ ตั้งท่าป้องกัน (+3 MP)');
    refresh(); await wait(400);
  } else if(type==='item'){
    S.inv[k]--;
    if(k==='bomb'){
      await throwArc(P, E, '💣');
      e.hp -= 35; hitFx(E); burst(E, '💥', 8, 80); shakeScene();
      floatText(E, '-35', 'crit');
      B.log.push('💣 ระเบิดพลาสมาใส่ศัตรู 35 ดาเมจ!');
    } else {
      const t = applyItem(k);
      sparkle(P, k==='potion' ? '💚' : '🔷', 8);
      floatText(P, t.replace(/\D+/g,'') ? '+' + t.replace(/\D+/g,'') : '+0', k==='potion' ? 'heal' : 'mp');
      B.log.push(ITEMS[k].e + ' ' + t);
      await wait(500);
    }
  } else if(type==='run'){
    if(Math.random() < .5){
      await an(P, [{transform:'translateX(0)'},{transform:'translateX(-30px) scaleX(-1)',offset:.2},
                   {transform:'translateX(-360px) scaleX(-1)'}], {duration:600,easing:'ease-in',fill:'forwards'});
      B.log.push('🏃 หนีสำเร็จ!'); B.over = true; B.busy = false; save(); refresh(); return;
    }
    await an(P, [{transform:'translateX(0)'},{transform:'translateX(-30px) rotate(-12deg)'},{transform:'translateX(0)'}], {duration:400});
    floatText(P, 'หนีไม่พ้น!', '');
    B.log.push('🏃 หนีไม่สำเร็จ!');
  }
  refresh();

  if(e.hp <= 0){
    await wait(250); await deathFx(E);
    burst(E, '💰', 6, 60);
    const lv0 = S.lv; win(); refresh();
    if(S.lv > lv0){ await wait(300); floatText(P, 'LEVEL UP!', 'big'); sparkle(P, '⭐', 12); charge(P, '#ffd60a'); }
    B.busy = false; save(); refresh(); return;
  }

  await wait(450);
  await enemyTurn(P, E);
  if(S.hp <= 0){
    await wait(250);
    await an(P, [{opacity:1,transform:'none'},{opacity:.25,transform:'rotate(-90deg) translate(-10px,10px)'}],
       {duration:650,fill:'forwards'});
    lose();
  }
  B.busy = false; save(); refresh();
}
async function enemyTurn(P, E){
  const e = B.en, heavy = Math.random() < (e.boss ? .3 : .18);
  let d = dmgCalc(e.atk, def(), heavy ? 1.5 : 1);
  if(B.defend) d = Math.max(1, Math.round(d/2));
  if(heavy){ floatText(E, '!!', 'crit'); await charge(E, '#ff4d6d'); }
  await lunge(E, -1, heavy);
  S.hp = Math.max(0, S.hp - d);
  hitFx(P); burst(P, B.defend ? '🛡️' : '✦', 3, 45);
  floatText(P, `-${d}`, heavy ? 'crit' : '');
  if(heavy) shakeScene();
  B.log.push(heavy ? `🔥 ${e.n} ใช้ท่าโจมตีหนัก! คุณโดน ${d}${B.defend?' (ป้องกันไว้ครึ่งหนึ่ง)':''}`
                   : `${e.e} ${e.n} โจมตี คุณโดน ${d}${B.defend?' (ป้องกันไว้ครึ่งหนึ่ง)':''}`);
  refresh();
  await wait(300);
}
function win(){
  const e = B.en; B.over = true;
  S.gold += e.gold; S.exp += e.exp; S.st.wins++; if(e.boss) S.st.bosses++;
  B.log.push(`🏆 ชนะ! ได้ ${e.gold}💰 และ ${e.exp} EXP`);
  if(Math.random() < (e.boss ? 1 : .3)){
    const ks = Object.keys(ITEMS), d = ks[Math.floor(Math.random()*ks.length)];
    S.inv[d] = (S.inv[d]||0) + 1;
    B.log.push(`🎁 ได้รับ ${ITEMS[d].e} ${ITEMS[d].n}`);
  }
  if(e.boss) B.log.push(`📖 จบบทที่ ${chapIdx(S.stage)+1}! เรื่องราวบทใหม่ปลดล็อกแล้ว`);
  S.stage++; S.best = Math.max(S.best, S.stage);
  while(S.exp >= expNeed()){
    S.exp -= expNeed(); S.lv++;
    S.mhp += 12; S.mmp += 4; S.batk += 3; S.bdef += 2; S.hp = S.mhp; S.mp = S.mmp;
    B.log.push(`⭐ เลเวลอัป! ตอนนี้ Lv.${S.lv} (HP/MP เต็ม)`);
  }
}
function lose(){
  B.over = true;
  const lost = Math.floor(S.gold/2); S.gold -= lost; S.hp = S.mhp; S.mp = S.mmp;
  B.log.push(`💀 คุณแพ้... เสีย ${lost}💰 และถูกส่งกลับฐาน`);
}

// ====== เซฟ / โหลดด้วยรหัส ======
function exportCode(){ return btoa(unescape(encodeURIComponent(JSON.stringify(S)))); }
function saveView(){
  return `<div class="card"><h2>⚙️ เซฟ / ตั้งค่า</h2>
    <p class="small">${storageOK ? '✅ เกมบันทึกอัตโนมัติในเครื่องนี้ทุกครั้งที่เล่น' : '⚠️ เบราว์เซอร์นี้ไม่ให้บันทึกอัตโนมัติ ใช้รหัสเซฟด้านล่างแทน'}</p>
    <p class="small">รหัสเซฟ: คัดลอกเก็บไว้ ใช้โหลดในเครื่องอื่น หรือตอนที่ข้อมูลหาย</p>
    <textarea id="code" readonly onclick="this.select()">${exportCode()}</textarea>
    <button class="full" onclick="copyCode()">📋 คัดลอกรหัส</button>
    <p class="small" style="margin-top:12px">โหลดจากรหัสเซฟ:</p>
    <textarea id="imp" placeholder="วางรหัสเซฟที่นี่"></textarea>
    <div class="btns" style="margin-top:6px">
      <button onclick="importCode()">📥 โหลด</button>
      <button class="warn" onclick="resetGame()">${resetArm ? '⚠️ กดอีกครั้งเพื่อยืนยัน' : '🗑️ เริ่มใหม่'}</button>
    </div>${note()}${back()}</div>`;
}
function copyCode(){
  const t = document.getElementById('code'); t.select();
  const done = () => { msg = '📋 คัดลอกแล้ว!'; render(); };
  if(navigator.clipboard) navigator.clipboard.writeText(t.value).then(done, () => { document.execCommand('copy'); done(); });
  else { document.execCommand('copy'); done(); }
}
function importCode(){
  try{
    const o = JSON.parse(decodeURIComponent(escape(atob(document.getElementById('imp').value.trim()))));
    if(typeof o.lv !== 'number' || !o.inv) throw 0;
    S = fix(o); save(); msg = '✅ โหลดเซฟสำเร็จ!';
  } catch(e){ msg = '❌ รหัสเซฟไม่ถูกต้อง'; }
  render();
}
function resetGame(){
  if(!resetArm){ resetArm = true; msg = ''; render(); return; }
  S = newGame(); save(); resetArm = false; msg = 'เริ่มเกมใหม่แล้ว'; render();
}

render();
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
